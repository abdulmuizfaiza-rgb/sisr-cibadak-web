// Baris baru (belum tersimpan ke server) baru benar-benar DIBUAT di database begitu 3 field wajib
// (Nama, Unit Kerja, Jabatan) sudah terisi -- sebelum itu perubahan hanya tersimpan di cache lokal.
async function simpanFieldOperatorKeServer(rec, fieldBaru){
  if(rec._belumTersimpan){
    if(!rec.nama_ops || !rec.unit_kerja || !rec.jabatan) return true; // belum cukup lengkap, simpan lokal dulu
    const payload = {nama_ops: rec.nama_ops, unit_kerja: rec.unit_kerja, jabatan: rec.jabatan, sub_rayon_id: rec.sub_rayon_id, input_by: rec.input_by};
    if(rec.status_kepegawaian) payload.status_kepegawaian = rec.status_kepegawaian;
    if(rec.nip) payload.nip = rec.nip;
    if(rec.tempat_lahir) payload.tempat_lahir = rec.tempat_lahir;
    if(rec.tanggal_lahir) payload.tanggal_lahir = rec.tanggal_lahir;
    if(rec.no_whatsapp) payload.no_whatsapp = rec.no_whatsapp;
    if(rec.alamat_rumah) payload.alamat_rumah = rec.alamat_rumah;
    const created = await api.post('/operator', payload);
    rec.id = created.id;
    delete rec._belumTersimpan;
    return true;
  }
  await api.patch('/operator/'+rec.id, {[fieldBaru]: rec[fieldBaru]});
  return true;
}
async function simpanOperatorInlineSel(id, field, rawValue){
  const rec = operatorList.find(function(o){return o.id===id;});
  if(!rec) return;
  const val2 = rawValue.trim ? rawValue.trim() : rawValue;
  if(field==='no_whatsapp' && val2 && !/^[0-9]{1,12}$/.test(val2)){
    state.sekolahValidasiPopup = {judul:'No WhatsApp Tidak Valid', pesan:'No WhatsApp maksimal 12 digit angka. Silakan input ulang.'};
    render();
    return;
  }
  rec[field] = val2;
  if(field==='jabatan' && rec.jabatan!=='Bendahara/Admin BOSP') rec.nama_admin_bosp = '';
  try {
    await simpanFieldOperatorKeServer(rec, field);
    if(field==='status_kepegawaian'){
      const ptkTerbaru = await api.get('/ptk');
      replaceArray(ptkList, ptkTerbaru);
    }
  } catch(err){ tampilkanErrorApi(err); return; }
  render();
}
function tempelDataOperatorInline(startIdStr, field, lines){
  const startId = parseInt(startIdStr, 10);
  const list = listOperatorTertampil();
  let startIdx = list.findIndex(function(x){ return x.id===startId; });
  if(startIdx===-1) startIdx = 0;
  const promiseChain = lines.reduce(function(chain, val, i){
    return chain.then(async function(){
      const idx = startIdx + i;
      let rec = list[idx];
      if(!rec){
        rec = { id: nextTempOperatorId--, _belumTersimpan: true, nama_ops:'', nip:'', tempat_lahir:'', tanggal_lahir:'', jabatan:'', nama_admin_bosp:'', unit_kerja:'',
          no_whatsapp:'', alamat_rumah:'', status_kepegawaian:'', foto_ops:null, sk_ops_bendahara:null,
          sub_rayon_id: subRayonIdWajib(), input_by: state.user.username };
        operatorList.push(rec);
        list.push(rec);
      }
      rec[field] = val.trim();
      try { await simpanFieldOperatorKeServer(rec, field); } catch(err){ tampilkanErrorApi(err); }
    });
  }, Promise.resolve());
  promiseChain.then(function(){
    showToast(lines.length+' baris berhasil ditempel ke kolom.');
    render();
  });
}
function listOperatorTertampil(){
  let filteredList = scopedOperator();
  if(state.filterSekolahOperator) filteredList = filteredList.filter(function(o){return o.unit_kerja===state.filterSekolahOperator;});
  filteredList = filteredList.slice().sort(function(a,b){return namaSekolah(a.unit_kerja).localeCompare(namaSekolah(b.unit_kerja));});
  return filteredList;
}

function namaSubRayonUser(){
  const sr = state.user.sub_rayon_id ? subRayons.find(function(s){return s.id===state.user.sub_rayon_id;}) : subRayons[0];
  return sr ? sr.nama_sub_rayon : '';
}
function kecamatanSubRayonUser(){
  const sr = state.user.sub_rayon_id ? subRayons.find(function(s){return s.id===state.user.sub_rayon_id;}) : subRayons[0];
  if(!sr) return '';
  const daftar = kecamatanUntukSubRayon(sr.nama_sub_rayon);
  return daftar.length ? daftar[0] : '';
}

function hitungPenerimaanBosp(){
  const siswaEl = document.getElementById('pbJumlahSiswa');
  const besaranEl = document.getElementById('pbBesaranSatuan');
  const jumlahSiswa = parseInt(String(siswaEl.value).replace(/[^0-9]/g,''),10) || 0;
  const besaranSatuan = parseInt(besaranEl.value.replace(/[^0-9]/g,''),10) || 0;
  besaranEl.value = besaranSatuan ? rupiah(besaranSatuan) : '';
  const penerimaan1Tahun = jumlahSiswa * besaranSatuan;
  const p1El = document.getElementById('pbPenerimaan1Tahun');
  if(p1El) p1El.value = rupiah(penerimaan1Tahun);
  const p1DisplayEl = document.getElementById('pbPenerimaan1TahunDisplay');
  if(p1DisplayEl) p1DisplayEl.textContent = rupiah(penerimaan1Tahun);

  const t1 = Math.round(penerimaan1Tahun/2);
  const t2 = penerimaan1Tahun - t1;
  const t1El = document.getElementById('pbTahap1');
  const t2El = document.getElementById('pbTahap2');
  if(t1El) t1El.value = rupiah(t1);
  if(t2El) t2El.value = rupiah(t2);
  const jumlahEl = document.getElementById('pbJumlah');
  if(jumlahEl) jumlahEl.value = rupiah(t1+t2);
  const jumlahDisplayEl = document.getElementById('pbJumlahDisplay');
  if(jumlahDisplayEl) jumlahDisplayEl.textContent = rupiah(t1+t2);

  // Kas Di Bank per Triwulan (otomatis)
  const tunai1El = document.getElementById('pbTunai1');
  const tunai2El = document.getElementById('pbTunai2');
  const tunai3El = document.getElementById('pbTunai3');
  const tunai4El = document.getElementById('pbTunai4');
  if(tunai1El) fmtGajiInput(tunai1El);
  if(tunai2El) fmtGajiInput(tunai2El);
  if(tunai3El) fmtGajiInput(tunai3El);
  if(tunai4El) fmtGajiInput(tunai4El);
  const tunai1 = tunai1El ? (parseInt(tunai1El.value.replace(/[^0-9]/g,''),10) || 0) : 0;
  const tunai2 = tunai2El ? (parseInt(tunai2El.value.replace(/[^0-9]/g,''),10) || 0) : 0;
  const tunai3 = tunai3El ? (parseInt(tunai3El.value.replace(/[^0-9]/g,''),10) || 0) : 0;
  const tunai4 = tunai4El ? (parseInt(tunai4El.value.replace(/[^0-9]/g,''),10) || 0) : 0;
  const kasBank1 = t1 - tunai1;
  const kasBank2 = kasBank1 - tunai2;
  const kasBank3 = t2 - tunai3;
  const kasBank4 = kasBank3 - tunai4;
  const kb1El = document.getElementById('pbKasBank1');
  const kb2El = document.getElementById('pbKasBank2');
  const kb3El = document.getElementById('pbKasBank3');
  const kb4El = document.getElementById('pbKasBank4');
  if(kb1El) kb1El.value = rupiah(kasBank1);
  if(kb2El) kb2El.value = rupiah(kasBank2);
  if(kb3El) kb3El.value = rupiah(kasBank3);
  if(kb4El) kb4El.value = rupiah(kasBank4);

  // Saldo Kas Tunai per Triwulan (otomatis): Tarik Tunai Tw dikurangi Total Realisasi Dana BOS Triwulan tsb (dari Laporan BPK)
  const username = state.user.username;
  const kasTunai1 = tunai1 - totalRealisasiDanaBosTw(1, username);
  const kasTunai2 = tunai2 - totalRealisasiDanaBosTw(2, username);
  const kasTunai3 = tunai3 - totalRealisasiDanaBosTw(3, username);
  const kasTunai4 = tunai4 - totalRealisasiDanaBosTw(4, username);
  const kt1El = document.getElementById('pbKasTunai1');
  const kt2El = document.getElementById('pbKasTunai2');
  const kt3El = document.getElementById('pbKasTunai3');
  const kt4El = document.getElementById('pbKasTunai4');
  if(kt1El) kt1El.value = rupiah(kasTunai1);
  if(kt2El) kt2El.value = rupiah(kasTunai2);
  if(kt3El) kt3El.value = rupiah(kasTunai3);
  if(kt4El) kt4El.value = rupiah(kasTunai4);
}

async function savePenerimaanBospClick(){
  const isNew = state.editingPenerimaanBosp === 'new';
  const npsn = val('pbNpsn').trim();
  const namaSekolah = val('pbNamaSekolah').trim();
  const kecamatan = val('pbKecamatan').trim();
  const subRayonNama = namaSubRayonUser();
  const kodeUpb = val('pbKodeUpb').trim();
  const jumlahSiswa = parseInt(val('pbJumlahSiswa').replace(/[^0-9]/g,''),10) || 0;
  const besaranSatuan = parseInt(val('pbBesaranSatuan').replace(/[^0-9]/g,''),10) || 0;
  const penerimaan1Tahun = jumlahSiswa * besaranSatuan;
  const tahap1 = Math.round(penerimaan1Tahun/2);
  const tahap2 = penerimaan1Tahun - tahap1;
  const tunai1 = parseInt(val('pbTunai1').replace(/[^0-9]/g,''),10) || 0;
  const tunai2 = parseInt(val('pbTunai2').replace(/[^0-9]/g,''),10) || 0;
  const tunai3 = parseInt(val('pbTunai3').replace(/[^0-9]/g,''),10) || 0;
  const tunai4 = parseInt(val('pbTunai4').replace(/[^0-9]/g,''),10) || 0;
  const kasBank1 = tahap1 - tunai1;
  const kasBank2 = kasBank1 - tunai2;
  const kasBank3 = tahap2 - tunai3;
  const kasBank4 = kasBank3 - tunai4;
  const kasTunai1 = tunai1 - totalRealisasiDanaBosTw(1, state.user.username);
  const kasTunai2 = tunai2 - totalRealisasiDanaBosTw(2, state.user.username);
  const kasTunai3 = tunai3 - totalRealisasiDanaBosTw(3, state.user.username);
  const kasTunai4 = tunai4 - totalRealisasiDanaBosTw(4, state.user.username);
  if(!npsn || !namaSekolah || !kecamatan || !kodeUpb){ showToast('Pilih Sekolah, isi Kecamatan, dan isi Kode UPB terlebih dahulu.'); return; }
  if(!jumlahSiswa || !besaranSatuan){ showToast('Isi Jumlah Siswa dan Besaran Satuan BOSP/Tahun terlebih dahulu.'); return; }
  const errs = [];
  if(tunai1 > tahap1){ errs.push('Tarik Tunai Tw1 ('+rupiah(tunai1)+') melebihi Penerimaan BOSP Tahap 1 ('+rupiah(tahap1)+').'); }
  if(tunai2 > (tahap1 - tunai1)){ errs.push('Tarik Tunai Tw2 ('+rupiah(tunai2)+') melebihi sisa Tahap 1 dikurangi Tarik Tunai Tw1 ('+rupiah(Math.max(tahap1-tunai1,0))+').'); }
  if(tunai3 > tahap2){ errs.push('Tarik Tunai Tw3 ('+rupiah(tunai3)+') melebihi Penerimaan BOSP Tahap 2 ('+rupiah(tahap2)+').'); }
  if(tunai4 > (tahap2 - tunai3)){ errs.push('Tarik Tunai Tw4 ('+rupiah(tunai4)+') melebihi sisa Tahap 2 dikurangi Tarik Tunai Tw3 ('+rupiah(Math.max(tahap2-tunai3,0))+').'); }
  if(errs.length>0){
    state.tarikTunaiErrors = errs;
    state.pendingPenerimaanBosp = { npsn:npsn, nama_sekolah:namaSekolah, kecamatan:kecamatan, kode_upb:kodeUpb, jumlah_siswa:jumlahSiswa, besaran_satuan:besaranSatuan, penerimaan_1_tahun:penerimaan1Tahun, tahap1:tahap1, tahap2:tahap2, jumlah:tahap1+tahap2, tunai1:tunai1, tunai2:tunai2, tunai3:tunai3, tunai4:tunai4, kas_bank1:kasBank1, kas_bank2:kasBank2, kas_bank3:kasBank3, kas_bank4:kasBank4, kas_tunai1:kasTunai1, kas_tunai2:kasTunai2, kas_tunai3:kasTunai3, kas_tunai4:kasTunai4 };
    render();
    return;
  }
  const jumlah = tahap1+tahap2;
  const payloadServer = {kode_upb: kodeUpb, jumlah_siswa: jumlahSiswa, besaran_satuan: besaranSatuan, tahap1: tahap1, tahap2: tahap2, tunai1: tunai1, tunai2: tunai2, tunai3: tunai3, tunai4: tunai4};
  try {
    if(isNew){
      if(penerimaanBospList.some(function(x){return x.npsn===npsn;})){ showToast('Sekolah ini sudah memiliki data Penerimaan BOSP. Silakan edit data yang sudah ada.'); return; }
      const created = await api.post('/penerimaan-bosp', Object.assign({tahun_anggaran: state.tahunAnggaran, npsn: npsn, sub_rayon_id: subRayonIdWajib(), input_by: state.user.username}, payloadServer));
      penerimaanBospList.push(Object.assign({nama_sekolah: namaSekolah, kecamatan: kecamatan, sub_rayon: subRayonNama, penerimaan_1_tahun: penerimaan1Tahun, jumlah: jumlah,
        kas_bank1:kasBank1, kas_bank2:kasBank2, kas_bank3:kasBank3, kas_bank4:kasBank4, kas_tunai1:kasTunai1, kas_tunai2:kasTunai2, kas_tunai3:kasTunai3, kas_tunai4:kasTunai4}, created));
      showToast('Data Penerimaan BOSP berhasil ditambahkan.');
    } else {
      const rec = penerimaanBospList.find(function(x){return x.id===state.editingPenerimaanBosp;});
      await api.patch('/penerimaan-bosp/'+rec.id, payloadServer);
      rec.kecamatan = kecamatan; rec.sub_rayon = subRayonNama; rec.kode_upb = kodeUpb;
      rec.jumlah_siswa = jumlahSiswa; rec.besaran_satuan = besaranSatuan; rec.penerimaan_1_tahun = penerimaan1Tahun; rec.tahap1 = tahap1; rec.tahap2 = tahap2; rec.jumlah = jumlah;
      rec.tunai1 = tunai1; rec.tunai2 = tunai2; rec.tunai3 = tunai3; rec.tunai4 = tunai4;
      rec.kas_bank1 = kasBank1; rec.kas_bank2 = kasBank2; rec.kas_bank3 = kasBank3; rec.kas_bank4 = kasBank4;
      rec.kas_tunai1 = kasTunai1; rec.kas_tunai2 = kasTunai2; rec.kas_tunai3 = kasTunai3; rec.kas_tunai4 = kasTunai4;
      showToast('Data Penerimaan BOSP berhasil diperbarui.');
    }
  } catch(err){ tampilkanErrorApi(err); return; }
  state.editingPenerimaanBosp = null;
  state.pendingPenerimaanBosp = null;
  render();
}

async function hapusPenerimaanBosp(id){
  const idx = penerimaanBospList.findIndex(function(x){return x.id===id;});
  if(idx===-1) return;
  try { await api.del('/penerimaan-bosp/'+id); }
  catch(err){ tampilkanErrorApi(err); return; }
  penerimaanBospList.splice(idx,1);
  showToast('Data Penerimaan BOSP berhasil dihapus.');
  render();
}

  {code:'aset_lainnya_kib_e', label:'Aset Tetap Lainnya (KIB E)'},
];

function bkuSaldoAkhirTriwulan(tw, username){
  const key = tw+'_'+username;
  const saldoAwal = bkuSaldoAwal[key] || 0;
  const entries = bkuEntries.filter(function(x){return x.triwulan===tw && x.input_by===username;});
  const withSaldo = hitungSaldoBerjalan(entries, saldoAwal);
  return withSaldo.length ? withSaldo[withSaldo.length-1].saldo : saldoAwal;
}
function saldoAwalLaporanBpk(tw, npsn, username){
  if(tw===1) return 0;
  const prevRecord = laporanBpkList.find(function(x){return x.npsn===npsn && x.triwulan===tw-1;});
  if(!prevRecord) return 0;
  return sisaDanaBosLaporanBpk(tw-1, npsn, username);
}
function penerimaanDanaBosLaporanBpk(tw, npsn){
  const rec = penerimaanBospList.find(function(x){return x.npsn===npsn;});
  if(!rec) return 0;
  if(tw===1) return rec.tahap1||0;
  if(tw===3) return rec.tahap2||0;
  return 0;
}
function kategoriTotalLaporanBpk(kode, tw, username){
  const kodeGabungan = kode==='rincian_belanja_pemeliharaan' ? ['rincian_belanja_pemeliharaan','pemeliharaan_komputer']
    : kode==='rincian_jasa_pemeliharaan' ? ['rincian_jasa_pemeliharaan','upah_pemeliharaan_komputer']
    : [kode];
  return bospEntries.filter(function(x){return kodeGabungan.indexOf(x.kategori)>-1 && x.triwulan===tw && x.input_by===username;}).reduce(function(s,x){return s+(x.jumlah||0);}, 0);
}
function totalRealisasiDanaBosTw(tw, username){
  const kategoriTotals = LAPORAN_BPK_KATEGORI_MAP.map(function(k){ return kategoriTotalLaporanBpk(k.code, tw, username); });
  const belanjaBarangHabisPakai = kategoriTotals[0];
  const totalBarangJasa = kategoriTotals.slice(1,9).reduce(function(s,v){return s+v;}, 0);
  const totalModal = kategoriTotals.slice(9,11).reduce(function(s,v){return s+v;}, 0);
  return belanjaBarangHabisPakai + totalBarangJasa + totalModal;
}
function sisaDanaBosLaporanBpk(tw, npsn, username){
  const saldoAwal = saldoAwalLaporanBpk(tw, npsn, username);
  const penerimaan = penerimaanDanaBosLaporanBpk(tw, npsn);
  const totalPenerimaan = saldoAwal + penerimaan;
  const kategoriTotals = LAPORAN_BPK_KATEGORI_MAP.map(function(k){ return kategoriTotalLaporanBpk(k.code, tw, username); });
  const belanjaBarangHabisPakai = kategoriTotals[0];
  const totalBarangJasa = kategoriTotals.slice(1,9).reduce(function(s,v){return s+v;}, 0);
  const totalModal = kategoriTotals.slice(9,11).reduce(function(s,v){return s+v;}, 0);
  const totalRealisasi = belanjaBarangHabisPakai + totalBarangJasa + totalModal;
  return totalPenerimaan - totalRealisasi;
}

function laporanBpkRowHtml(x, tw, no){
  const saldoAwal = saldoAwalLaporanBpk(tw, x.npsn, x.input_by);
  const penerimaan = penerimaanDanaBosLaporanBpk(tw, x.npsn);
  const totalPenerimaan = saldoAwal + penerimaan;
  const kategoriTotals = LAPORAN_BPK_KATEGORI_MAP.map(function(k){ return kategoriTotalLaporanBpk(k.code, tw, x.input_by); });
  const belanjaBarangHabisPakai = kategoriTotals[0];
  const totalBarangJasa = kategoriTotals.slice(1,9).reduce(function(s,v){return s+v;}, 0);
  const totalModal = kategoriTotals.slice(9,11).reduce(function(s,v){return s+v;}, 0);
  const totalRealisasi = belanjaBarangHabisPakai + totalBarangJasa + totalModal;
  const sisaDanaBos = totalPenerimaan - totalRealisasi;
  // Saldo Rekening/Kas Bank & Saldo Kas Tunai: otomatis dari data Penerimaan BOSP sekolah ini, sesuai Triwulan.
  const pb = penerimaanBospList.find(function(p){return p.npsn===x.npsn;});
  const kasBankField = 'kas_bank'+tw, tunaiField = 'tunai'+tw;
  const saldoBank = pb ? (pb[kasBankField]||0) : 0;
  const tarikTunaiTw = pb ? (pb[tunaiField]||0) : 0;
  const saldoTunai = tarikTunaiTw - totalRealisasi;
  const keteranganSaldo = saldoBank + saldoTunai;
  const verifikasiSaldo = sisaDanaBos===keteranganSaldo ? 'SAMA' : 'Tidak Sama';
  return '<tr><td>'+(no!=null?no:'')+'</td><td>'+esc(x.kode_upb)+'</td><td>'+esc(x.npsn)+'</td><td>'+esc(x.nama_sekolah)+'</td><td>'+esc(x.kecamatan)+'</td><td>'+esc(x.sub_rayon)+'</td><td>Triwulan '+tw+'</td>'
    + '<td class="text-end">'+rupiah(saldoAwal)+'</td><td class="text-end">'+rupiah(penerimaan)+'</td><td class="text-end fw-bold">'+rupiah(totalPenerimaan)+'</td>'
    + '<td class="text-end">'+rupiah(belanjaBarangHabisPakai)+'</td>'
    + kategoriTotals.slice(1,9).map(function(v){return '<td class="text-end">'+rupiah(v)+'</td>';}).join('')
    + '<td class="text-end fw-bold">'+rupiah(totalBarangJasa)+'</td>'
    + kategoriTotals.slice(9,11).map(function(v){return '<td class="text-end">'+rupiah(v)+'</td>';}).join('')
    + '<td class="text-end fw-bold">'+rupiah(totalModal)+'</td>'
    + '<td class="text-end fw-bold">'+rupiah(totalRealisasi)+'</td>'
    + '<td class="text-end fw-bold">'+rupiah(sisaDanaBos)+'</td>'
    + '<td class="text-end" title="Otomatis dari Saldo Kas Di Bank Triwulan '+tw+' pada menu Penerimaan BOSP">'+rupiah(saldoBank)+'</td>'
    + '<td class="text-end" title="Otomatis dari Saldo Kas Tunai Triwulan '+tw+' pada menu Penerimaan BOSP">'+rupiah(saldoTunai)+'</td>'
    + '<td class="text-end fw-bold">'+rupiah(keteranganSaldo)+'</td>'
    + '<td class="text-center"><span class="badge '+(verifikasiSaldo==='SAMA'?'bg-success':'bg-danger')+'">'+verifikasiSaldo+'</span></td>'
    + '<td class="text-center"><button class="btn btn-sm btn-outline-primary" '+act('editLaporanBpk',[x.id])+'>'+ICONS.pencil+'</button> '
    + '<button class="btn btn-sm btn-outline-danger" '+act('hapusLaporanBpk',[x.id])+'>'+ICONS.trash+'</button></td></tr>';
}

async function simpanLaporanBpkSaldoSel(key, rawValue){
  const parts = key.split(':');
  const id = parseInt(parts[0],10), field = parts[1];
  const rec = laporanBpkList.find(function(x){return x.id===id;});
  if(!rec) return;
  const angka = parseInt(String(rawValue).replace(/[^0-9]/g,''),10) || 0;
  rec[field] = angka;
  const kolomBackend = field==='saldo_rekening_bank' ? 'saldo_bank_tw'+rec.triwulan : 'saldo_tunai_tw'+rec.triwulan;
  try {
    await api.put('/laporan-bpk', {tahun_anggaran: state.tahunAnggaran, npsn: rec.npsn, [kolomBackend]: angka, sub_rayon_id: rec.sub_rayon_id, input_by: rec.input_by,
      saldo_bank_tw1: rec.triwulan===1&&field==='saldo_rekening_bank'?angka:(laporanBpkSaldoTw(rec.npsn,1,'saldo_rekening_bank')),
      saldo_bank_tw2: rec.triwulan===2&&field==='saldo_rekening_bank'?angka:(laporanBpkSaldoTw(rec.npsn,2,'saldo_rekening_bank')),
      saldo_bank_tw3: rec.triwulan===3&&field==='saldo_rekening_bank'?angka:(laporanBpkSaldoTw(rec.npsn,3,'saldo_rekening_bank')),
      saldo_bank_tw4: rec.triwulan===4&&field==='saldo_rekening_bank'?angka:(laporanBpkSaldoTw(rec.npsn,4,'saldo_rekening_bank')),
      saldo_tunai_tw1: rec.triwulan===1&&field==='saldo_kas_tunai'?angka:(laporanBpkSaldoTw(rec.npsn,1,'saldo_kas_tunai')),
      saldo_tunai_tw2: rec.triwulan===2&&field==='saldo_kas_tunai'?angka:(laporanBpkSaldoTw(rec.npsn,2,'saldo_kas_tunai')),
      saldo_tunai_tw3: rec.triwulan===3&&field==='saldo_kas_tunai'?angka:(laporanBpkSaldoTw(rec.npsn,3,'saldo_kas_tunai')),
      saldo_tunai_tw4: rec.triwulan===4&&field==='saldo_kas_tunai'?angka:(laporanBpkSaldoTw(rec.npsn,4,'saldo_kas_tunai')),
    });
  } catch(err){ tampilkanErrorApi(err); return; }
  render();
}
function laporanBpkSaldoTw(npsn, tw, field){
  const rec = laporanBpkList.find(function(x){return x.npsn===npsn && x.triwulan===tw;});
  return rec ? (rec[field]||0) : 0;
}

async function saveLaporanBpkClick(tw){
  const isNew = state.editingBosp === 'new';
  const npsn = val('lbpkNpsn').trim();
  const namaSekolah = val('lbpkNamaSekolah').trim();
  const kodeUpb = val('lbpkKodeUpb').trim();
  const kecamatan = val('lbpkKecamatan').trim();
  const subRayonTxt = val('lbpkSubRayon').trim();
  if(!npsn || !namaSekolah || !kodeUpb || !kecamatan || !subRayonTxt){ showToast('Semua field wajib diisi.'); return; }
  if(isNew){
    if(laporanBpkList.some(function(x){return x.npsn===npsn && x.triwulan===tw;})){ showToast('Data untuk sekolah ini pada Triwulan '+tw+' sudah ada. Silakan edit data yang sudah ada.'); return; }
    try {
      await api.put('/laporan-bpk', {tahun_anggaran: state.tahunAnggaran, npsn: npsn, sub_rayon_id: subRayonIdWajib(), input_by: state.user.username});
    } catch(err){ tampilkanErrorApi(err); return; }
    laporanBpkList.push({
      id: nextLaporanBpkId++, npsn: npsn, nama_sekolah: namaSekolah, kode_upb: kodeUpb, kecamatan: kecamatan, sub_rayon: subRayonTxt,
      saldo_rekening_bank: 0, saldo_kas_tunai: 0,
      triwulan: tw, sub_rayon_id: subRayonIdWajib(), input_by: state.user.username,
    });
    showToast('Data Laporan Realisasi BOSP-Form BPK berhasil ditambahkan.');
  } else {
    const rec = laporanBpkList.find(function(x){return x.id===state.editingBosp;});
    rec.kode_upb = kodeUpb; rec.kecamatan = kecamatan; rec.sub_rayon = subRayonTxt;
    showToast('Data Laporan Realisasi BOSP-Form BPK berhasil diperbarui.');
  }
  state.editingBosp = null;
  render();
}

async function hapusLaporanBpk(id){
  const idx = laporanBpkList.findIndex(function(x){return x.id===id;});
  if(idx===-1) return;
  const rec = laporanBpkList[idx];
  const masihAdaTwLain = laporanBpkList.some(function(x){return x.npsn===rec.npsn && x.id!==id;});
  laporanBpkList.splice(idx,1);
  if(!masihAdaTwLain){

function hitungBosp(){

  const jumlahEl = document.getElementById('bospJumlah');
  if(jumlahEl) jumlahEl.value = rupiah(vol*harga);
}

function saveBospClick(kategori, tw){
  const isNew = state.editingBosp === 'new';
  const tanggal = val('bospTanggal'), uraian = val('bospUraian').trim();
  const volume = parseFloat(val('bospVolume').replace(/[^0-9.]/g,'')) || 0;
  const satuan = val('bospSatuan').trim();
  const harga = parseFloat(val('bospHarga').replace(/[^0-9]/g,'')) || 0;
  if(!tanggal || !uraian || !volume || !satuan || !harga){ showToast('Semua field wajib diisi.'); return; }
  const jumlah = volume*harga;
  if(isNew){
    bospEntries.push({
      id: nextBospId++, kategori: kategori, triwulan: tw, tanggal: tanggal, uraian: uraian,
      volume: volume, satuan: satuan, harga_satuan: harga, jumlah: jumlah,
      sub_rayon_id: subRayonIdWajib(), input_by: state.user.username,
    });
    showToast('Data berhasil ditambahkan.');
  } else {
    const rec = bospEntries.find(function(x){return x.id===state.editingBosp;});
    Object.assign(rec, {tanggal:tanggal, uraian:uraian, volume:volume, satuan:satuan, harga_satuan:harga, jumlah:jumlah});
    showToast('Data berhasil diperbarui.');
  }
  state.editingBosp = null;
  render();
}

async function hapusBosp(id){
  const idx = bospEntries.findIndex(function(x){return x.id===id;});
  if(idx===-1) return;
  try { await api.del('/bosp-entries/'+id); }
  catch(err){ tampilkanErrorApi(err); return; }
  bospEntries.splice(idx,1);
  showToast('Data berhasil dihapus.');
  render();
}

// ============================================================
// EXPORT EXCEL — pakai library ExcelJS untuk membuat file .xlsx ASLI
// (bukan trik HTML disamarkan .xls, supaya garis/format dijamin tersimpan
// sebagai properti Excel sungguhan dan konsisten di Excel/LibreOffice/Sheets)
// ============================================================
const THIN_BORDER = {top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};

// ============================================================
// EXPORT/IMPORT EXCEL GENERIK — SEMUA MENU LPJ BOSP
// F4/Legal, margin 2,5cm semua sisi, ada garis, dropdown utk field pilihan,
// rumus otomatis utk kolom hasil perhitungan (kolom itu dikunci saat proteksi lembar).
// ============================================================
const CM_TO_INCH = 0.393701;
function applyPageSetupBosp(sheet){
  sheet.pageSetup = {
    orientation: 'landscape',
    paperWidth: '21.5cm', paperHeight: '33cm', // F4/Folio
    fitToPage: false,
    margins: { top: 2.5*CM_TO_INCH, bottom: 2.5*CM_TO_INCH, left: 2.5*CM_TO_INCH, right: 2.5*CM_TO_INCH, header: 0.3, footer: 0.3 },
  };
}
function refSekolahList(){
  return state.user.role==='superadmin' ? penerimaanBospList : penerimaanBospList.filter(function(x){return x.input_by===state.user.username;});
}
function buildRefSheet(wb){
  const ref = wb.addWorksheet('RefSekolah');
  ref.state = 'veryHidden';
  ref.addRow(['NPSN','Nama Sekolah','Kode UPB']);
  const list = refSekolahList();
  list.forEach(function(x){ ref.addRow([x.npsn, x.nama_sekolah, x.kode_upb||'']); });
  return Math.max(list.length,1);
}
async function protectSheetKeepFormula(sheet, formulaCols){
  sheet.eachRow(function(row, rowNum){
    row.eachCell({includeEmpty:true}, function(cell, colNum){
      cell.protection = { locked: rowNum>1 && formulaCols.indexOf(colNum)>-1 };
    });
  });
  await sheet.protect('', { selectLockedCells:false, selectUnlockedCells:true, formatCells:false });
}
function readImportedWorkbook(file, callback){
  const reader = new FileReader();
  reader.onload = function(ev){
    const wb = new ExcelJS.Workbook();
    wb.xlsx.load(ev.target.result).then(function(){
      const sheet = wb.getWorksheet('Data') || wb.worksheets[0];
      callback(sheet);
    }).catch(function(err){ showToast('Gagal membaca file: '+err.message); });
  };
  reader.readAsArrayBuffer(file);
}
function objectsDiffer(existing, newData){
  return Object.keys(newData).some(function(k){
    const a = existing[k]===undefined||existing[k]===null ? '' : String(existing[k]);
    const b = newData[k]===undefined||newData[k]===null ? '' : String(newData[k]);
    return a !== b;
  });
}
function cellText(row, col){
  const c = row.getCell(col);
  const v = c.value;
  if(v===null || v===undefined) return '';
  if(typeof v==='object' && v.result!==undefined) return String(v.result||'').trim();
  if(v instanceof Date) return v.toISOString().slice(0,10);
  return String(v).trim();
}
function cellDate(row, col){
  const c = row.getCell(col);
  const v = c.value;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v==='object' && v && v.result instanceof Date) return v.result.toISOString().slice(0,10);
  const t = cellText(row, col);
  return t || new Date().toISOString().slice(0,10);
}
function cellNumber(row, col){
  const c = row.getCell(col);
  const v = c.value;
  if(v===null || v===undefined) return 0;
  if(typeof v==='object' && v.result!==undefined) return parseFloat(v.result)||0;
  return parseFloat(v)||0;
}

const BOSP_BARANG_TOTAL_LABEL = {
  rincian_belanja_pemeliharaan: 'Total Harga Barang',

  rincian_jasa_pemeliharaan: 'Total Harga Jasa Pemeliharaan',

  peralatan_mesin_kib_b: 'Total Harga KIB-B',
  aset_lainnya_kib_e: 'Total Harga KIB-E',
  belanja_barang_habis_pakai: 'Total Harga Habis Pakai',
};
async function exportBospBarangExcel(kode, tw){
  if(typeof ExcelJS==='undefined'){ showToast('Library Excel belum selesai dimuat. Tunggu beberapa detik lalu coba lagi.'); return; }
  const list = scopedBosp(kode, tw);
  const totalLabel = BOSP_BARANG_TOTAL_LABEL[kode] || 'Total Harga';
  const wb = new ExcelJS.Workbook();
  const sheet = wb.addWorksheet('Data');
  applyPageSetupBosp(sheet);
  const refCount = buildRefSheet(wb);
  sheet.columns = [{width:5},{width:13},{width:12},{width:24},{width:22},{width:18},{width:9},{width:10},{width:14},{width:16},{width:13},{width:13},{width:22}];
  const headers = ['No','Kode UPB','NPSN','Nama Sekolah','Nama Barang','Nama Merk Barang','Volume','Satuan','Harga Satuan',totalLabel,'Asal Usul','Tanggal Bayar','Keterangan'];
  sheet.addRow(headers).eachCell(function(c){ styleHeaderCell(c); });
  const totalRows = Math.max(list.length+10, 20);
  for(let i=0;i<totalRows;i++){
    const r = i+2;
    const x = list[i];
    const row = sheet.addRow([i+1, null, x?x.npsn:'', null, x?x.nama_barang:'', x?x.merk_barang:'', x?x.volume:'', x?x.satuan:'', x?x.harga_satuan:'', null, x?x.asal_usul:'', x&&x.tanggal?new Date(x.tanggal):null, x?x.keterangan:'']);
    row.getCell(2).value = { formula: 'IFERROR(VLOOKUP(C'+r+",RefSekolah!$A$2:$C$"+(refCount+1)+',3,FALSE),"")' };
    row.getCell(4).value = { formula: 'IFERROR(VLOOKUP(C'+r+",RefSekolah!$A$2:$C$"+(refCount+1)+',2,FALSE),"")' };
    row.getCell(10).value = { formula: 'G'+r+'*I'+r };
    row.getCell(9).numFmt = '"Rp" #,##0'; row.getCell(10).numFmt = '"Rp" #,##0'; row.getCell(12).numFmt = 'dd/mm/yyyy';
    row.eachCell({includeEmpty:true}, function(c){ c.border = THIN_BORDER; c.alignment = {vertical:'middle', wrapText:true}; });
    sheet.getCell('C'+r).dataValidation = { type:'list', allowBlank:true, formulae:['RefSekolah!$A$2:$A$'+(refCount+1)] };
    sheet.getCell('K'+r).dataValidation = { type:'list', allowBlank:true, formulae:['"BOSP/JKN,BOSP Kinerja"'] };
  }
  await protectSheetKeepFormula(sheet, [2,4,10]);
  downloadWorkbook(wb, 'Export_'+kode+'_Tw'+tw+'.xlsx');
}
function importBospBarangExcel(kode, tw, sheet){
  let added = 0, updated = 0, unchanged = 0;
  for(let r=2; r<=sheet.rowCount; r++){
    const row = sheet.getRow(r);
    const npsn = cellText(row,3).trim();
    const namaBarang = cellText(row,5).trim();
    if(!npsn || !namaBarang) continue;
    const rec = penerimaanBospList.find(function(x){return x.npsn===npsn;});
    const volume = cellNumber(row,7), harga = cellNumber(row,9);
    const merkBarang = cellText(row,6);
    // Kunci unik satu baris = kategori + triwulan + NPSN + Nama Barang + Nama Merk Barang.
    // Kalau sudah ada, TIMPA (update) data lama itu -- bukan bikin baris baru.
    const existing = bospEntries.find(function(x){
      return x.kategori===kode && x.triwulan===tw && x.npsn===npsn && x.nama_barang===namaBarang && x.merk_barang===merkBarang;
    });
    const data = {
      npsn: npsn, nama_sekolah: rec?rec.nama_sekolah:cellText(row,4), kode_upb: rec?(rec.kode_upb||''):cellText(row,2),
      nama_barang: namaBarang, merk_barang: merkBarang, volume: volume, satuan: cellText(row,8),
      harga_satuan: harga, jumlah: volume*harga, asal_usul: cellText(row,11), tanggal: cellDate(row,12), keterangan: cellText(row,13),
    };
    if(existing){ if(objectsDiffer(existing, data)){ Object.assign(existing, data); updated++; } else { unchanged++; } }
    else { bospEntries.push(Object.assign({id: nextBospId++, kategori: kode, triwulan: tw, sub_rayon_id: subRayonIdWajib(), input_by: state.user.username}, data)); added++; }
  }
  showToast(added+' baris data baru ditambahkan, '+updated+' baris data diperbarui (ada perbedaan), '+unchanged+' baris data tidak berubah (data sama persis).');
  render();
}

function colLetter(n){
  let s='';
  while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); }
  return s;
}
function validateHeaderRow(sheet, expectedHeaders){
  const row = sheet.getRow(1);
  const errors = [];
  expectedHeaders.forEach(function(exp, idx){
    const col = idx+1;
    const found = cellText(row, col);
    if(found !== exp){
      errors.push({baris:1, kolom: colLetter(col), field:'Judul Kolom '+colLetter(col), ditemukan: found||'(kosong)', seharusnya: exp});
    }
  });
  return errors;
}
function isBarisKosong(vals){ return vals.every(function(v){ return !v || String(v).trim()===''; }); }

function importBospKategoriClick(kode, tw){
  const inp = document.createElement('input');

  inp.onchange = function(){
    const file = inp.files[0];
    if(!file) return;
    readImportedWorkbook(file, function(sheet){
      let headerErrors = [], rowErrors = [];
      if(BOSP_BARANG_KATEGORI_LIST.indexOf(kode)>-1){
        const totalLabel = BOSP_BARANG_TOTAL_LABEL[kode] || 'Total Harga';
        headerErrors = validateHeaderRow(sheet, ['No','Kode UPB','NPSN','Nama Sekolah','Nama Barang','Nama Merk Barang','Volume','Satuan','Harga Satuan',totalLabel,'Asal Usul','Tanggal Bayar','Keterangan']);
        rowErrors = validateBarangRows(kode, sheet);

        const info = BOSP_SIMPLE_INFO[kode] || {uraian:'Uraian', jumlah:'Jumlah'};
        headerErrors = validateHeaderRow(sheet, ['No','NPSN','Nama Sekolah',info.uraian,'Volume','Satuan','Tarif Harga',info.jumlah,'Tanggal Bayar']);
        rowErrors = validateSimpleRows(kode, sheet);

        rowErrors = validateJasaPendidikRows(sheet);
      }
      const errors = headerErrors.concat(rowErrors);
      if(errors.length>0){ state.importValidationErrors = errors; render(); return; }
      if(BOSP_BARANG_KATEGORI_LIST.indexOf(kode)>-1) importBospBarangExcel(kode, tw, sheet);
      else if(BOSP_SIMPLE_KATEGORI_LIST.indexOf(kode)>-1) importBospSimpleExcel(kode, tw, sheet);

function getBospTableData(kode, tw){
  if(BOSP_BARANG_KATEGORI_LIST.indexOf(kode)>-1){
    const totalLabel = BOSP_BARANG_TOTAL_LABEL[kode] || 'Total Harga';
    const list = scopedBosp(kode, tw);
    const headers = ['No','Kode UPB','NPSN','Nama Sekolah','Nama Barang','Nama Merk Barang','Volume','Satuan','Harga Satuan',totalLabel,'Asal Usul','Tanggal Bayar','Keterangan'];
    const rows = list.map(function(x,i){ return [i+1, x.kode_upb||'-', x.npsn||'-', x.nama_sekolah||'-', x.nama_barang, x.merk_barang, x.volume, x.satuan, rupiah(x.harga_satuan), rupiah(x.jumlah), x.asal_usul, fmtTgl(x.tanggal), x.keterangan||'-']; });
    const total = list.reduce(function(s,x){return s+(x.jumlah||0);},0);
    return {title: bospLabel(kode), headers: headers, rows: rows, totalLabelText: 'Total', totalValue: rupiah(total), totalColIdx: 10};
  }
  if(BOSP_SIMPLE_KATEGORI_LIST.indexOf(kode)>-1){
    const info = BOSP_SIMPLE_INFO[kode] || {uraian:'Uraian', jumlah:'Jumlah'};
    const list = scopedBosp(kode, tw);
    const headers = ['No','NPSN','Nama Sekolah',info.uraian,'Volume','Satuan','Tarif Harga',info.jumlah,'Tanggal Bayar'];
    const rows = list.map(function(x,i){ return [i+1, x.npsn||'-', x.nama_sekolah||'-', x.uraian, x.volume, x.satuan, rupiah(x.harga_satuan), rupiah(x.jumlah), fmtTgl(x.tanggal)]; });
    const total = list.reduce(function(s,x){return s+(x.jumlah||0);},0);
    return {title: bospLabel(kode), headers: headers, rows: rows, totalLabelText: 'Total', totalValue: rupiah(total), totalColIdx: 8};
  }
  if(kode==='jasa_pendidik_tendik'){
    const list = sortByNamaSekolah(scopedJasaPendidik(tw));
    const headers = ['No','NPSN','Nama Sekolah','NUPTK','Nama Penerima','Volume','Satuan','Tarif Harga','Jumlah Gaji','Tanggal Bayar'];
    const rows = list.map(function(x,i){ return [i+1, x.npsn||'-', x.nama_sekolah||'-', x.nuptk||'-', x.nama_penerima||'-', x.volume, x.satuan, rupiah(x.harga_satuan), rupiah(x.jumlah), fmtTgl(x.tanggal)]; });
    const total = list.reduce(function(s,x){return s+(x.jumlah||0);},0);
    return {title: 'Jasa Pendidik & Tendik', headers: headers, rows: rows, totalLabelText: 'Total', totalValue: rupiah(total), totalColIdx: 9};
  }
  return null;
}

function bospSignatureInfo(){
  const sekolah = scopedSekolah()[0] || {};
  const bendahara = operatorList.find(function(o){return o.jabatan==='Bendahara/Admin BOSP';}) || {};
  const today = new Date();
  const bulanNama = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const tanggalStr = today.getDate()+' '+bulanNama[today.getMonth()]+' '+today.getFullYear();
  const tempat = (sekolah.nama_pemda || '').split(' ').slice(-1)[0] || (sekolah.nama_pemda||'');
  return {
    tempatTanggal: (tempat||'-')+', '+tanggalStr,
    kepsekNama: sekolah.nama_kepala_sekolah || '-', kepsekNip: sekolah.nip_kepala_sekolah || '-',
    bendaharaNama: bendahara.nama_ops || '-', bendaharaNip: '-',
  };
}

    ['Nama Sekolah', sekolah.nama_sekolah || '-'],

    const total = all.reduce(function(s,x){return s+(x.jumlah||0);},0);

    const total = all.reduce(function(s,x){return s+(x.jumlah||0);},0);
    return {title:'Jasa Pendidik & Tendik', headers: headers, rows: rows, totalLabelText:'Total', totalValue: rupiah(total), totalColIdx: 10};
  }
  return null;
}

function writeBospSheetGeneric(sheet, data, titleSuffix, twLabel){
  if(!data) return;
  const ncol = data.headers.length;
  sheet.columns = data.headers.map(function(){ return {width:16}; });
  sheet.mergeCells(1,1,1,ncol); styleTitleCell(sheet.getCell(1,1));
  sheet.getCell(1,1).value = data.title.toUpperCase()+' — '+titleSuffix;
  sheet.getCell(1,1).alignment = {horizontal:'center', vertical:'middle'};

  const infoRows = bospInfoBlokKiri(twLabel);
  infoRows.forEach(function(pair){
    const row = sheet.addRow([pair[0]+' :', pair[1]]);
    row.getCell(1).font = {bold:true};
  });
  sheet.addRow([]);

  const header = sheet.addRow(data.headers);
  header.eachCell(function(c){ styleHeaderCell(c); c.alignment = {horizontal:'center', vertical:'middle', wrapText:true, textRotation:0}; });
  data.rows.forEach(function(r){ const row = sheet.addRow(r); row.eachCell({includeEmpty:true}, function(c){ c.border = THIN_BORDER; c.alignment = {vertical:'middle', wrapText:true}; }); });
  if(data.rows.length===0){
    const emptyRow = sheet.addRow(['Belum ada data.']);
    sheet.mergeCells(emptyRow.number,1,emptyRow.number,ncol);
    emptyRow.getCell(1).alignment = {horizontal:'center'};
    emptyRow.getCell(1).border = THIN_BORDER;
  } else {
    const totalRow = sheet.addRow([]);
    totalRow.getCell(Math.max(data.totalColIdx-1,1)).value = data.totalLabelText;
    totalRow.getCell(Math.max(data.totalColIdx-1,1)).font = {bold:true};
    totalRow.getCell(data.totalColIdx).value = data.totalValue;
    totalRow.getCell(data.totalColIdx).font = {bold:true};
    totalRow.eachCell({includeEmpty:true}, function(c){ c.border = THIN_BORDER; });
  }
  sheet.addRow([]); sheet.addRow([]);
  const sig = bospSignatureInfo();
  const leftCol = 3, rightCol = Math.max(ncol-2, leftCol+3);
  const rowM = sheet.addRow([]); rowM.getCell(leftCol).value = 'Mengetahui,'; rowM.getCell(rightCol).value = sig.tempatTanggal;
  const rowJ = sheet.addRow([]); rowJ.getCell(leftCol).value = 'Kepala Sekolah'; rowJ.getCell(rightCol).value = 'Bendahara BOSP';
  sheet.addRow([]); sheet.addRow([]); sheet.addRow([]);
  const rowN = sheet.addRow([]);
  rowN.getCell(leftCol).value = sig.kepsekNama; rowN.getCell(leftCol).font = {underline:true, bold:true};
  rowN.getCell(rightCol).value = sig.bendaharaNama; rowN.getCell(rightCol).font = {underline:true, bold:true};
  const rowP = sheet.addRow([]);
  rowP.getCell(leftCol).value = 'NIP. '+sig.kepsekNip; rowP.getCell(rightCol).value = 'NIP. '+sig.bendaharaNip;
}

async function unduhBospKategoriExcel(kode, tw){
  if(typeof ExcelJS==='undefined'){ showToast('Library Excel belum selesai dimuat. Tunggu beberapa detik lalu coba lagi.'); return; }
  const wb = new ExcelJS.Workbook();
  const sheet = wb.addWorksheet('Data');
  applyPageSetupBosp(sheet);
  writeBospSheetWithSignature(sheet, kode, tw);
  downloadWorkbook(wb, bospLabel(kode)+'_Triwulan'+tw+'_'+state.tahunAnggaran+'.xlsx');
}

async function unduhSemuaMenuExcel(tw){
  if(typeof ExcelJS==='undefined'){ showToast('Library Excel belum selesai dimuat. Tunggu beberapa detik lalu coba lagi.'); return; }
  const wb = new ExcelJS.Workbook();
  UNDUHAN_KATEGORI_LIST.forEach(function(kode){
    const sheetName = bospLabel(kode).substring(0,31).replace(/[\\/*?:\[\]]/g,'-');
    const sheet = wb.addWorksheet(sheetName);
    applyPageSetupBosp(sheet);
    writeBospSheetWithSignature(sheet, kode, tw);
  });
  const sheetBpk = wb.addWorksheet('Laporan Realisasi BPK');
  writeLaporanBpkSheet(sheetBpk, [tw], 'TRIWULAN '+tw, 'Triwulan '+tw);
  downloadWorkbook(wb, 'LPJ BOSP Triwulan '+tw+' '+state.tahunAnggaran+'.xlsx');
}

function outputPdf(doc, filename, preview){
  if(preview){ window.open(doc.output('bloburl'), '_blank'); }
  else { doc.save(filename); }
}
function unduhBospKategoriPdf(kode, tw, preview){
  if(typeof window.jspdf==='undefined'){ showToast('Library PDF belum selesai dimuat. Tunggu beberapa detik lalu coba lagi.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'cm', format:[33,21.5]});
  tulisTabelKePdf(doc, kode, tw, 1.5);
  outputPdf(doc, bospLabel(kode)+'_Triwulan'+tw+'_'+state.tahunAnggaran+'.pdf', preview);
}
function previewBospKategoriPdf(kode, tw){ unduhBospKategoriPdf(kode, tw, true); }

function unduhSemuaMenuPdf(tw, preview){
  if(typeof window.jspdf==='undefined'){ showToast('Library PDF belum selesai dimuat. Tunggu beberapa detik lalu coba lagi.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'cm', format:[33,21.5]});
  UNDUHAN_KATEGORI_LIST.forEach(function(kode, i){
    if(i>0) doc.addPage([33,21.5], 'landscape');
    tulisTabelKePdf(doc, kode, tw, 1.5);
  });
  doc.addPage([33,21.5], 'landscape');
  unduhLaporanBpkPdfGeneric([tw], 'TRIWULAN '+tw, 'Triwulan '+tw, '', doc);

function laporanBpkExportHeaders(){
  const headers = ['No','Kode UPB','NPSN','Nama Sekolah','Kecamatan','Sub Rayon','Triwulan',
    'Saldo Awal Dana BOSP TA '+state.tahunAnggaran,'Penerimaan Dana BOS','Total Penerimaan',
    LAPORAN_BPK_KATEGORI_MAP[0].label];
  LAPORAN_BPK_KATEGORI_MAP.slice(1,9).forEach(function(k){ headers.push(k.label); });
  headers.push('Total Belanja Barang dan Jasa');
  LAPORAN_BPK_KATEGORI_MAP.slice(9,11).forEach(function(k){ headers.push(k.label); });
  headers.push('Total Belanja Modal');
  headers.push('Total Realisasi Dana BOS','Sisa Dana BOS','Saldo Rekening/Kas Bank','Saldo Kas Tunai','Keterangan Saldo','Verifikasi Saldo');
  return headers;
}
function laporanBpkExportRow(x, tw, no){
  const saldoAwal = saldoAwalLaporanBpk(tw, x.npsn, x.input_by);
  const penerimaan = penerimaanDanaBosLaporanBpk(tw, x.npsn);
  const totalPenerimaan = saldoAwal + penerimaan;
  const kategoriTotals = LAPORAN_BPK_KATEGORI_MAP.map(function(k){ return kategoriTotalLaporanBpk(k.code, tw, x.input_by); });
  const belanjaBarangHabisPakai = kategoriTotals[0];
  const totalBarangJasa = kategoriTotals.slice(1,9).reduce(function(s,v){return s+v;}, 0);
  const totalModal = kategoriTotals.slice(9,11).reduce(function(s,v){return s+v;}, 0);
  const totalRealisasi = belanjaBarangHabisPakai + totalBarangJasa + totalModal;
  const sisaDanaBos = totalPenerimaan - totalRealisasi;
  const pb = penerimaanBospList.find(function(p){return p.npsn===x.npsn;});
  const saldoBank = pb ? (pb['kas_bank'+tw]||0) : 0;
  const saldoTunai = (pb ? (pb['tunai'+tw]||0) : 0) - totalRealisasi;
  const keteranganSaldo = saldoBank+saldoTunai;
  const verifikasi = sisaDanaBos===keteranganSaldo ? 'SAMA' : 'Tidak Sama';
  return [no, x.kode_upb, x.npsn, x.nama_sekolah, x.kecamatan, x.sub_rayon, 'Triwulan '+tw,
    rupiah(saldoAwal), rupiah(penerimaan), rupiah(totalPenerimaan), rupiah(belanjaBarangHabisPakai)]
    .concat(kategoriTotals.slice(1,9).map(rupiah)).concat([rupiah(totalBarangJasa)])
    .concat(kategoriTotals.slice(9,11).map(rupiah)).concat([rupiah(totalModal), rupiah(totalRealisasi), rupiah(sisaDanaBos), rupiah(saldoBank), rupiah(saldoTunai), rupiah(keteranganSaldo), verifikasi]);
}
function writeLaporanBpkSheet(sheet, twList, judulSuffix, twLabel){
  applyPageSetupBosp(sheet);
  const headers = laporanBpkExportHeaders();
  sheet.columns = headers.map(function(){ return {width:15}; });
  sheet.mergeCells(1,1,1,headers.length); styleTitleCell(sheet.getCell(1,1));
  sheet.getCell(1,1).value = 'LAPORAN REALISASI BOSP-FORM BPK — '+judulSuffix+' TAHUN ANGGARAN '+state.tahunAnggaran;
  sheet.getCell(1,1).alignment = {horizontal:'center', vertical:'middle'};
  const infoRows = bospInfoBlokKiri(twLabel);
  infoRows.forEach(function(pair){ const row = sheet.addRow([pair[0]+' :', pair[1]]); row.getCell(1).font = {bold:true}; });
  sheet.addRow([]);
  const header = sheet.addRow(headers);
  header.eachCell(function(c){ styleHeaderCell(c); c.alignment = {horizontal:'center', vertical:'middle', wrapText:true, textRotation:0}; });
  let no = 1, anyData = false;
  twList.forEach(function(tw){
    sortByNamaSekolah(scopedLaporanBpk(tw)).forEach(function(x){
      anyData = true;
      const row = sheet.addRow(laporanBpkExportRow(x, tw, no++));
      row.eachCell({includeEmpty:true}, function(c){ c.border = THIN_BORDER; c.alignment = {vertical:'middle', wrapText:true}; });
    });
  });
  if(!anyData){
    const emptyRow = sheet.addRow(['Belum ada data.']);
    sheet.mergeCells(emptyRow.number,1,emptyRow.number,headers.length);
    emptyRow.getCell(1).alignment = {horizontal:'center'}; emptyRow.getCell(1).border = THIN_BORDER;
  }
  sheet.addRow([]); sheet.addRow([]);
  const sig = bospSignatureInfo();
  const leftCol = 3, rightCol = Math.max(headers.length-2, leftCol+3);
  const rowM = sheet.addRow([]); rowM.getCell(leftCol).value = 'Mengetahui,'; rowM.getCell(rightCol).value = sig.tempatTanggal;
  const rowJ = sheet.addRow([]); rowJ.getCell(leftCol).value = 'Kepala Sekolah'; rowJ.getCell(rightCol).value = 'Bendahara BOSP';
  sheet.addRow([]); sheet.addRow([]); sheet.addRow([]);
  const rowN = sheet.addRow([]);
  rowN.getCell(leftCol).value = sig.kepsekNama; rowN.getCell(leftCol).font = {underline:true, bold:true};
  rowN.getCell(rightCol).value = sig.bendaharaNama; rowN.getCell(rightCol).font = {underline:true, bold:true};
  const rowP = sheet.addRow([]);
  rowP.getCell(leftCol).value = 'NIP. '+sig.kepsekNip; rowP.getCell(rightCol).value = 'NIP. '+sig.bendaharaNip;
}

function unduhLaporanBpkPdfGeneric(twList, judulSuffix, twLabel, namaFile, docParam){
  const useExisting = !!docParam;
  let doc = docParam;
  if(!useExisting){
    if(typeof window.jspdf==='undefined'){ showToast('Library PDF belum selesai dimuat. Tunggu beberapa detik lalu coba lagi.'); return; }
    const { jsPDF } = window.jspdf;
    doc = new jsPDF({orientation:'landscape', unit:'cm', format:[33,21.5]});
  }
  const marginCm = 1.5;
  doc.setFontSize(12); doc.setFont(undefined,'bold');
  doc.text('LAPORAN REALISASI BOSP-FORM BPK — '+judulSuffix+' TAHUN ANGGARAN '+state.tahunAnggaran, doc.internal.pageSize.getWidth()/2, marginCm, {align:'center'});
  const infoRows = bospInfoBlokKiri(twLabel);
  doc.setFontSize(8.5); doc.setFont(undefined,'normal');
  let infoY = marginCm + 0.9;
  infoRows.forEach(function(pair){
    doc.setFont(undefined,'bold'); doc.text(pair[0]+' :', marginCm, infoY);
    doc.setFont(undefined,'normal'); doc.text(String(pair[1]), marginCm+3.2, infoY);
    infoY += 0.55;
  });
  const headers = laporanBpkExportHeaders();
  let rows = [];
  let no = 1;
  twList.forEach(function(tw){ sortByNamaSekolah(scopedLaporanBpk(tw)).forEach(function(x){ rows.push(laporanBpkExportRow(x, tw, no++)); }); });
  if(rows.length===0) rows = [['Belum ada data.'].concat(Array(headers.length-1).fill(''))];
  doc.autoTable({
    head: [headers], body: rows, startY: infoY+0.3,
    margin: {left:marginCm, right:marginCm, top:marginCm, bottom:marginCm},
    styles: {fontSize:5.5, cellPadding:1, lineColor:[0,0,0], lineWidth:0.02, overflow:'linebreak', valign:'middle', halign:'left'},
    headStyles: {fillColor:[240,240,240], textColor:[0,0,0], fontStyle:'bold', halign:'center', valign:'middle', fontSize:5.5, overflow:'linebreak', minCellHeight:6},
    theme: 'grid', tableWidth: 'auto', horizontalPageBreak: false,
  });
  let y = doc.lastAutoTable.finalY + 1;
  const sig = bospSignatureInfo();
  const pageW = doc.internal.pageSize.getWidth();
  const leftX = marginCm+2, rightX = pageW-marginCm-6;
  doc.setFontSize(9); doc.setFont(undefined,'normal');
  doc.text('Mengetahui,', leftX, y); doc.text(sig.tempatTanggal, rightX, y);
  y += 0.6;
  doc.text('Kepala Sekolah', leftX, y); doc.text('Bendahara BOSP', rightX, y);
  y += 2.2;
  doc.setFont(undefined,'bold');
  doc.text(sig.kepsekNama, leftX, y); doc.text(sig.bendaharaNama, rightX, y);
  y += 0.5;
  doc.setFont(undefined,'normal');
  doc.text('NIP. '+sig.kepsekNip, leftX, y); doc.text('NIP. '+sig.bendaharaNip, rightX, y);
  if(!useExisting){ doc.save(namaFile); }
  return doc;
}

function tulisTabelGenericKePdf(doc, data, titleSuffix, twLabel, marginCm){
  if(!data) return;
  doc.setFontSize(12);
  doc.setFont(undefined, 'bold');
  doc.text(data.title.toUpperCase()+' — '+titleSuffix, doc.internal.pageSize.getWidth()/2, marginCm, {align:'center'});

  const infoRows = bospInfoBlokKiri(twLabel);
  doc.setFontSize(8.5); doc.setFont(undefined,'normal');
  let infoY = marginCm + 0.9;
  infoRows.forEach(function(pair){
    doc.setFont(undefined,'bold');
    doc.text(pair[0]+' :', marginCm, infoY);
    doc.setFont(undefined,'normal');
    doc.text(String(pair[1]), marginCm+3.2, infoY);
    infoY += 0.55;
  });
  const tableStartY = infoY + 0.3;

  const body = data.rows.length ? data.rows : [['Belum ada data.'].concat(Array(data.headers.length-1).fill(''))];
  doc.autoTable({
    head: [data.headers],
    body: body,
    startY: tableStartY,
    margin: {left: marginCm, right: marginCm, top: marginCm, bottom: marginCm},
    styles: {fontSize:7, cellPadding:1.3, lineColor:[0,0,0], lineWidth:0.02, overflow:'linebreak', valign:'middle', halign:'left'},
    headStyles: {fillColor:[240,240,240], textColor:[0,0,0], fontStyle:'bold', halign:'center', valign:'middle', fontSize:6.8, overflow:'linebreak', minCellHeight:6},
    bodyStyles: {halign:'left'},
    theme: 'grid',
    tableWidth: 'auto',
    horizontalPageBreak: false,
  });
  let y = doc.lastAutoTable.finalY + 0.5;
  if(data.rows.length>0){
    doc.setFontSize(9); doc.setFont(undefined,'normal');
    doc.text(data.totalLabelText+': '+data.totalValue, doc.internal.pageSize.getWidth()-marginCm, y, {align:'right'});
    y += 1;
  }
  const sig = bospSignatureInfo();
  const pageW = doc.internal.pageSize.getWidth();
  const leftX = marginCm+2, rightX = pageW-marginCm-6;
  y += 1;
  doc.setFontSize(9); doc.setFont(undefined,'normal');
  doc.text('Mengetahui,', leftX, y);
  doc.text(sig.tempatTanggal, rightX, y);
  y += 0.6;
  doc.text('Kepala Sekolah', leftX, y);
  doc.text('Bendahara BOSP', rightX, y);
  y += 2.2;
  doc.setFont(undefined,'bold');
  doc.text(sig.kepsekNama, leftX, y);
  doc.text(sig.bendaharaNama, rightX, y);
  y += 0.5;
  doc.setFont(undefined,'normal');
  doc.text('NIP. '+sig.kepsekNip, leftX, y);
  doc.text('NIP. '+sig.bendaharaNip, rightX, y);
}

let pajakDataByUser = {}; // { [username]: { saldoAwal:number, bulan:[ {d:{ppn,pph21,pph23,pph4,sspd}, k:{...}} x12 ] } }
const PAJAK_FIELDS = ['ppn','pph21','pph23','pph4','sspd'];
const PAJAK_FIELD_LABELS = {ppn:'PPN', pph21:'PPh 21', pph23:'PPh 23', pph4:'PPh 4', sspd:'SSPD'};
const PAJAK_BULAN_NAMA = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function getPajakData(){
  const key = state.user.username;
  if(!pajakDataByUser[key]){
    pajakDataByUser[key] = {
      saldoAwal: 0,
      bulan: Array.from({length:12}, function(){ return { d:{ppn:0,pph21:0,pph23:0,pph4:0,sspd:0}, k:{ppn:0,pph21:0,pph23:0,pph4:0,sspd:0} }; }),
    };
  }
  return pajakDataByUser[key];
}
function pajakJumlah(sisi){ return (sisi.ppn||0)+(sisi.pph21||0)+(sisi.pph23||0)+(sisi.pph4||0)+(sisi.sspd||0); }
function pajakHitungSaldoBulanan(data){
  let saldo = data.saldoAwal||0;
  return data.bulan.map(function(b){
    const jd = pajakJumlah(b.d), jk = pajakJumlah(b.k);
    saldo = saldo + jd - jk;
    return {jd:jd, jk:jk, saldo:saldo};
  });
}
function pajakHitungTriwulan(data){
  const bulanSaldo = pajakHitungSaldoBulanan(data);
  const out = [];
  for(let tw=0; tw<4; tw++){
    const start = tw*3, end = start+2;
    const d = {ppn:0,pph21:0,pph23:0,pph4:0,sspd:0}, k = {ppn:0,pph21:0,pph23:0,pph4:0,sspd:0};
    data.bulan.slice(start, end+1).forEach(function(b){
      PAJAK_FIELDS.forEach(function(f){ d[f]+=b.d[f]||0; k[f]+=b.k[f]||0; });
    });
    out.push({d:d, k:k, jd:pajakJumlah(d), jk:pajakJumlah(k), saldo: bulanSaldo[end].saldo});
  }
  return out;
}
function pajakTotalTahunan(data){
  const d = {ppn:0,pph21:0,pph23:0,pph4:0,sspd:0}, k = {ppn:0,pph21:0,pph23:0,pph4:0,sspd:0};
  data.bulan.forEach(function(b){ PAJAK_FIELDS.forEach(function(f){ d[f]+=b.d[f]||0; k[f]+=b.k[f]||0; }); });
  return {d:d, k:k, jd:pajakJumlah(d), jk:pajakJumlah(k)};
}
function angkaSaja(n){ return n ? n.toLocaleString('id-ID') : ''; }

async function simpanPajakKeServer(){
  try {
    await api.put('/pajak', {tahun_anggaran: state.tahunAnggaran, input_by: state.user.username, sub_rayon_id: subRayonIdWajib(), data: getPajakData()});
  } catch(err){ tampilkanErrorApi(err); }
}
async function simpanPajakSel(key, rawValue){
  const parts = key.split(':');
  const bulan = parseInt(parts[0],10), sisi = parts[1], field = parts[2];
  const angka = parseInt(String(rawValue).replace(/[^0-9]/g,''),10) || 0;
  const data = getPajakData();
  if(sisi==='k'){
    const debitVal = data.bulan[bulan].d[field] || 0;
    if(angka !== debitVal){
      state.pajakMismatchPopup = { bulan:bulan, sisi:sisi, field:field, angka:angka, debitVal:debitVal };
      render();
      return;
    }
  }
  data.bulan[bulan][sisi][field] = angka;
  if(sisi==='d' && angka===0){ data.bulan[bulan].k[field] = 0; }
  await simpanPajakKeServer();
  render();
}
async function konfirmasiPajakMismatchYa(){
  const p = state.pajakMismatchPopup;
  if(!p) return;
  const data = getPajakData();
  data.bulan[p.bulan][p.sisi][p.field] = p.angka;
  state.pajakMismatchPopup = null;
  await simpanPajakKeServer();
  showToast('Angka Pengeluaran/Kredit bulan '+PAJAK_BULAN_NAMA[p.bulan]+' berhasil disimpan (termasuk tunggakan pajak bulan sebelumnya).');
  render();
}
function konfirmasiPajakMismatchTidak(){
  const p = state.pajakMismatchPopup;
  state.pajakMismatchPopup = null;
  render();
  if(p){
    setTimeout(function(){
      const el = document.getElementById('pajakCell_'+p.bulan+'_'+p.sisi+'_'+p.field);
      if(el){
        const data = getPajakData();
        el.value = data.bulan[p.bulan][p.sisi][p.field] ? angkaSaja(data.bulan[p.bulan][p.sisi][p.field]) : '';
        el.focus(); if(el.select) el.select();
      }
    }, 30);
  }
}
function viewPajakMismatchPopup(){
  const p = state.pajakMismatchPopup;
  return '<div class="modal-backdrop-custom"><div class="modal-card-custom" style="max-width:460px;">'
    + '<div class="fw-bold text-warning mb-2">Angka Tidak Sama dengan Kolom Penerimaan/Debit</div>'
    + '<p class="mb-2">Angka Pengeluaran/Kredit yang Anda masukkan ('+rupiah(p.angka)+') tidak sama dengan Penerimaan/Debit bulan '+PAJAK_BULAN_NAMA[p.bulan]+' ('+rupiah(p.debitVal)+').</p>'
    + '<p class="mb-3">Apakah ini karena membayar pajak bulan '+PAJAK_BULAN_NAMA[p.bulan]+' ditambah tunggakan pajak bulan sebelumnya yang belum dibayar? Klik <strong>Ya</strong> untuk membuka kolom tersebut supaya angka ini bisa disimpan, atau <strong>Batal</strong> untuk memperbaiki input.</p>'
    + '<div class="d-flex gap-2">'
    + '<button type="button" class="btn btn-success btn-sm flex-fill" '+act('konfirmasiPajakMismatchYa')+'>Ya</button>'
    + '<button type="button" class="btn btn-secondary btn-sm flex-fill" '+act('konfirmasiPajakMismatchTidak')+'>Batal</button>'
    + '</div></div></div>';
}
async function simpanPajakSaldoAwal(rawValue){
  const angka = parseInt(String(rawValue).replace(/[^0-9]/g,''),10) || 0;
  getPajakData().saldoAwal = angka;
  await simpanPajakKeServer();
  render();
}

    + ' data-pajak-nav="'+bulanIdx+':'+sisi+':'+field+'"/></td>';
}

  sheet.mergeCells(h1.number,3,h1.number,8);
  sheet.mergeCells(h1.number,9,h1.number,14);
  sheet.mergeCells(h1.number,1,h1.number+1,1);
  sheet.mergeCells(h1.number,2,h1.number+1,2);
  sheet.mergeCells(h1.number,15,h1.number+1,15);
  h1.eachCell(function(c){ styleHeaderCell(c); c.alignment={horizontal:'center', vertical:'middle', wrapText:true, textRotation:0}; });
  const h2 = sheet.addRow(['','','PPN','PPh 21','PPh 23','PPh 4','SSPD','Jumlah','PPN','PPh 21','PPh 23','PPh 4','SSPD','Jumlah','']);
  h2.eachCell(function(c){ styleHeaderCell(c); c.alignment={horizontal:'center', vertical:'middle', wrapText:true, textRotation:0}; });

  const rSaldo = sheet.addRow(['','Saldo','','','','','','','','','','','','', data.saldoAwal]);

  rSaldo.getCell(2).font = {bold:true};
  rSaldo.getCell(15).numFmt = '#,##0'; rSaldo.getCell(15).font = {bold:true};

  PAJAK_BULAN_NAMA.forEach(function(nm,i){
    const b = data.bulan[i], bs = bulanSaldo[i];
    const row = sheet.addRow([i+1, nm, b.d.ppn, b.d.pph21, b.d.pph23, b.d.pph4, b.d.sspd, bs.jd, b.k.ppn, b.k.pph21, b.k.pph23, b.k.pph4, b.k.sspd, bs.jk, bs.saldo]);
    row.eachCell({includeEmpty:true}, function(c,col){ c.border=THIN_BORDER; if(col>=3) c.numFmt='#,##0'; });
  });
  const rTotal = sheet.addRow(['','Jumlah', totalTahun.d.ppn, totalTahun.d.pph21, totalTahun.d.pph23, totalTahun.d.pph4, totalTahun.d.sspd, totalTahun.jd, totalTahun.k.ppn, totalTahun.k.pph21, totalTahun.k.pph23, totalTahun.k.pph4, totalTahun.k.sspd, totalTahun.jk, saldoAkhirTahun]);
  rTotal.eachCell({includeEmpty:true}, function(c,col){ c.font={bold:true}; c.border=THIN_BORDER; if(col>=3) c.numFmt='#,##0'; });

  const rowJ = sheet.addRow([]); rowJ.getCell(kolKepsek).value='Kepala Sekolah'; rowJ.getCell(kolBendahara).value='Bendahara BOSP';
  sheet.addRow([]); sheet.addRow([]); sheet.addRow([]);

function unduhPajakPdf(){
  if(typeof window.jspdf==='undefined'){ showToast('Library PDF belum selesai dimuat. Tunggu beberapa detik lalu coba lagi.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'cm', format:[33,21.5]});
  const marginCm = 1.5;
  const data = getPajakData();
  const bulanSaldo = pajakHitungSaldoBulanan(data);
  const totalTahun = pajakTotalTahunan(data);
  const saldoAkhirTahun = bulanSaldo.length ? bulanSaldo[bulanSaldo.length-1].saldo : data.saldoAwal;

  doc.setFontSize(13); doc.setFont(undefined,'bold');
  doc.text('REKAPITULASI PAJAK REGULER DAN PAJAK DAERAH', doc.internal.pageSize.getWidth()/2, marginCm, {align:'center'});
  doc.text('DANA BANTUAN OPERASIONAL SEKOLAH (BOS)', doc.internal.pageSize.getWidth()/2, marginCm+0.6, {align:'center'});
  doc.setFontSize(10); doc.setFont(undefined,'normal');
  doc.text('PERIODE JANUARI-DESEMBER TAHUN ANGGARAN '+state.tahunAnggaran, doc.internal.pageSize.getWidth()/2, marginCm+1.1, {align:'center'});

  const head = [
    [{content:'No', rowSpan:2}, {content:'Bulan', rowSpan:2}, {content:'Penerimaan / Debit', colSpan:6, styles:{halign:'center'}}, {content:'Pengeluaran / Kredit', colSpan:6, styles:{halign:'center'}}, {content:'Saldo', rowSpan:2}],
    ['PPN','PPh 21','PPh 23','PPh 4','SSPD','Jumlah','PPN','PPh 21','PPh 23','PPh 4','SSPD','Jumlah'],
  ];
  const body = [['','Saldo','','','','','','','','','','','','', angkaSaja(data.saldoAwal)]];
  PAJAK_BULAN_NAMA.forEach(function(nm,i){
    const b = data.bulan[i], bs = bulanSaldo[i];
    body.push([i+1, nm, angkaSaja(b.d.ppn), angkaSaja(b.d.pph21), angkaSaja(b.d.pph23), angkaSaja(b.d.pph4), angkaSaja(b.d.sspd), angkaSaja(bs.jd), angkaSaja(b.k.ppn), angkaSaja(b.k.pph21), angkaSaja(b.k.pph23), angkaSaja(b.k.pph4), angkaSaja(b.k.sspd), angkaSaja(bs.jk), angkaSaja(bs.saldo)]);
  });
  body.push(['','Jumlah', angkaSaja(totalTahun.d.ppn), angkaSaja(totalTahun.d.pph21), angkaSaja(totalTahun.d.pph23), angkaSaja(totalTahun.d.pph4), angkaSaja(totalTahun.d.sspd), angkaSaja(totalTahun.jd), angkaSaja(totalTahun.k.ppn), angkaSaja(totalTahun.k.pph21), angkaSaja(totalTahun.k.pph23), angkaSaja(totalTahun.k.pph4), angkaSaja(totalTahun.k.sspd), angkaSaja(totalTahun.jk), angkaSaja(saldoAkhirTahun)]);

  doc.autoTable({
    head: head, body: body, startY: marginCm+1.6,
    margin: {left:marginCm, right:marginCm, top:marginCm, bottom:marginCm},
    styles: {fontSize:7, cellPadding:1.3, lineColor:[0,0,0], lineWidth:0.02, overflow:'linebreak', valign:'middle', halign:'right'},
    columnStyles: {0:{halign:'center'}, 1:{halign:'left'}},
    headStyles: {fillColor:[240,240,240], textColor:[0,0,0], fontStyle:'bold', halign:'center', valign:'middle', fontSize:7, overflow:'linebreak'},
    theme: 'grid', tableWidth: 'auto', horizontalPageBreak: false,
  });

  let y = doc.lastAutoTable.finalY + 1;
  const sig = bospSignatureInfo();
  const pageW = doc.internal.pageSize.getWidth();
  const kolWidth = (pageW - marginCm*2) / 15;
  const kepsekX = marginCm + kolWidth*2.5;
  const bendaharaX = marginCm + kolWidth*11.5;
  doc.setFontSize(9); doc.setFont(undefined,'normal');
  doc.text('Mengetahui,', kepsekX, y);
  doc.text(sig.tempatTanggal, bendaharaX, y);
  y += 0.6;
  doc.text('Kepala Sekolah', kepsekX, y);
  doc.text('Bendahara BOSP', bendaharaX, y);
  y += 2.2;
  doc.setFont(undefined,'bold');
  doc.text(sig.kepsekNama, kepsekX, y);
  doc.text(sig.bendaharaNama, bendaharaX, y);
  y += 0.5;
  doc.setFont(undefined,'normal');
  doc.text('NIP. '+sig.kepsekNip, kepsekX, y);
  doc.text('NIP. '+sig.bendaharaNip, bendaharaX, y);

  doc.save('Pajak_LPJ_BOSP_'+state.tahunAnggaran+'.pdf');
}

function editInformasi(id){ state.editingInformasi = id; render(); }
function cancelInformasi(){ state.editingInformasi = null; render(); }
async function saveInformasiClick(){
  const judul = val('infJudul').trim();
  const isi = val('infIsi').trim();
  const deadline = val('infDeadline');
  const tujuanJabatan = ADMIN_JABATAN_LIST.filter(function(j){ const el = document.getElementById('infJabatan_'+j.replace(/[^a-zA-Z0-9]/g,'')); return el && el.checked; });
  if(!judul || !isi){ showToast('Judul dan Isi Informasi wajib diisi.'); return; }
  if(tujuanJabatan.length===0){ showToast('Pilih minimal satu Tujuan Kirim (Jabatan).'); return; }
  const isNew = state.editingInformasi === 'new';
  try {
    if(isNew){
      const created = await api.post('/informasi', {judul: judul, isi: isi, deadline: deadline||null, tujuan_jabatan: tujuanJabatan});
      informasiList.push(Object.assign({}, created, {tujuanJabatan: created.tujuan_jabatan}));
      showToast('Informasi berhasil ditambahkan (belum dikirim ke Admin).');
    } else {
      const rec = informasiList.find(function(x){return x.id===state.editingInformasi;});
      await api.patch('/informasi/'+rec.id, {judul: judul, isi: isi, deadline: deadline||null, tujuan_jabatan: tujuanJabatan});
      rec.judul = judul; rec.isi = isi; rec.deadline = deadline; rec.tujuanJabatan = tujuanJabatan;
      showToast('Informasi berhasil diperbarui.');
    }
  } catch(err){ tampilkanErrorApi(err); return; }
  state.editingInformasi = null;
  render();
}
async function hapusInformasi(id){
  const idx = informasiList.findIndex(function(x){return x.id===id;});
  if(idx===-1) return;
  try { await api.del('/informasi/'+id); }
  catch(err){ tampilkanErrorApi(err); return; }
  informasiList.splice(idx,1);
  showToast('Informasi berhasil dihapus.');
  render();
}
async function kirimInformasi(id){
  const rec = informasiList.find(function(x){return x.id===id;});
  if(!rec) return;
  try { await api.patch('/informasi/'+id+'/kirim'); }
  catch(err){ tampilkanErrorApi(err); return; }
  rec.terkirim = true;
  rec.tanggal_kirim = new Date().toISOString().slice(0,10);
  showToast('Informasi berhasil dikirim ke semua akses Admin.');
  render();
}
async function batalKirimInformasi(id){
  const rec = informasiList.find(function(x){return x.id===id;});
  if(!rec) return;
  try { await api.patch('/informasi/'+id+'/batal-kirim'); }
  catch(err){ tampilkanErrorApi(err); return; }
  rec.terkirim = false;
  rec.tanggal_kirim = null;
  showToast('Pengiriman Informasi dibatalkan, Admin tidak akan melihatnya lagi.');
  render();
}

let stockOpnameList = []; // {id, npsn, nama_sekolah, subrayon, nama_barang, unit, harga, saldo_awal_kuantitas, penerimaan_kuantitas, pengeluaran_kuantitas, keterangan, sub_rayon_id, input_by}
let nextStockOpnameId = 1;
let stockOpnameZoom = 100;

function scopedStockOpname(){
  return stockOpnameList.filter(function(x){ return state.user.role==='superadmin' || x.input_by===state.user.username; });
}
function stockOpnameKeteranganOptions(){
  return [1,2,3,4].map(function(tw){ return 'BOSP TRIWULAN '+tw+' TAHUN '+state.tahunAnggaran; });
}
function stockOpnameSaldoAwalOtomatis(rec){
  const opsi = stockOpnameKeteranganOptions();
  const idx = opsi.indexOf(rec.keterangan);
  if(idx<=0) return 0; // Triwulan 1 atau belum dipilih Keterangan-nya -> saldo awal 0
  const labelSebelumnya = opsi[idx-1];
  const prev = stockOpnameList.find(function(x){ return x.npsn===rec.npsn && x.nama_barang===rec.nama_barang && x.keterangan===labelSebelumnya; });
  if(!prev) return 0;
  return stockOpnameHitung(prev).saldoAkhirKuantitas;
}
function stockOpnameHitung(x){
  const saldoAwalKuantitas = stockOpnameSaldoAwalOtomatis(x);
  const jumlahSaldoAwal = saldoAwalKuantitas * (x.harga||0);
  const jumlahPenerimaan = (x.penerimaan_kuantitas||0) * (x.harga||0);
  const jumlahPengeluaran = (x.pengeluaran_kuantitas||0) * (x.harga||0);
  const saldoAkhirKuantitas = saldoAwalKuantitas + (x.penerimaan_kuantitas||0) - (x.pengeluaran_kuantitas||0);
  const jumlahSaldoAkhir = saldoAkhirKuantitas * (x.harga||0);
  return { saldoAwalKuantitas:saldoAwalKuantitas, jumlahSaldoAwal:jumlahSaldoAwal, jumlahPenerimaan:jumlahPenerimaan, jumlahPengeluaran:jumlahPengeluaran, saldoAkhirKuantitas:saldoAkhirKuantitas, jumlahSaldoAkhir:jumlahSaldoAkhir };
}

async function hapusStockOpname(id){
  const idx = stockOpnameList.findIndex(function(x){return x.id===id;});
  if(idx===-1) return;
  try { await api.del('/stock-opname/'+id); }
  catch(err){ tampilkanErrorApi(err); return; }
  stockOpnameList.splice(idx,1);
  showToast('Baris berhasil dihapus.');
  render();
}
function setStockOpnameField(rec, field, rawValue){
  if(field==='npsn'){
    rec.npsn = rawValue.trim();
    const src = penerimaanBospList.find(function(p){return p.npsn===rec.npsn;});
    if(src){ rec.nama_sekolah = src.nama_sekolah; rec.subrayon = src.sub_rayon || rec.subrayon; }
  } else if(['harga','saldo_awal_kuantitas','penerimaan_kuantitas','pengeluaran_kuantitas'].indexOf(field)>-1){
    rec[field] = parseFloat(String(rawValue).replace(/[^0-9.]/g,'')) || 0;
  } else {
    rec[field] = rawValue.trim();
  }
}
async function simpanStockOpnameSel(key, rawValue){
  const parts = key.split(':');
  const id = parseInt(parts[0],10), field = parts[1];
  const rec = stockOpnameList.find(function(x){return x.id===id;});
  if(!rec) return;
  setStockOpnameField(rec, field, rawValue);
  const payload = {};
  payload[field] = rec[field];
  try { await api.patch('/stock-opname/'+id, payload); }
  catch(err){ tampilkanErrorApi(err); return; }
  render();
}
function tempelDataStockOpname(startRowIdStr, field, lines){
  const startId = parseInt(startRowIdStr, 10);
  const scoped = scopedStockOpname();
  let startIdx = scoped.findIndex(function(x){ return x.id===startId; });
  if(startIdx===-1) startIdx = 0;
  const promiseChain = lines.reduce(function(chain, val, i){
    return chain.then(async function(){
      const idx = startIdx + i;
      let rec = scoped[idx];
      if(!rec){
        const created = await api.post('/stock-opname', {tahun_anggaran: state.tahunAnggaran, sub_rayon_id: subRayonIdWajib(), input_by: state.user.username});
        rec = Object.assign({nama_sekolah:'', subrayon:''}, created);
        stockOpnameList.push(rec);
        scoped.push(rec);
      }
      setStockOpnameField(rec, field, val);
      const payload = {};
      payload[field] = rec[field];
      try { await api.patch('/stock-opname/'+rec.id, payload); }
      catch(err){ tampilkanErrorApi(err); }
    });
  }, Promise.resolve());
  promiseChain.then(function(){
    showToast(lines.length+' baris berhasil ditempel ke kolom.');
    render();
  });
}

function importStockOpnameClick(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx';
  inp.onchange = function(){
    const file = inp.files[0];
    if(!file) return;
    readImportedWorkbook(file, function(sheet){
      let added = 0, updated = 0, unchanged = 0;
      for(let r=2; r<=sheet.rowCount; r++){
        const row = sheet.getRow(r);
        const npsn = cellText(row,2).trim();
        const namaBarang = cellText(row,4).trim();
        if(!npsn || !namaBarang) continue;
        const src = penerimaanBospList.find(function(p){return p.npsn===npsn;});
        const data = {
          npsn: npsn, nama_sekolah: src?src.nama_sekolah:'', subrayon: cellText(row,3), nama_barang: namaBarang, unit: cellText(row,5),
          harga: cellNumber(row,6), penerimaan_kuantitas: cellNumber(row,7), pengeluaran_kuantitas: cellNumber(row,8), keterangan: cellText(row,9),
        };
        const existing = stockOpnameList.find(function(x){ return x.npsn===npsn && x.nama_barang===namaBarang && x.keterangan===data.keterangan; });
        if(existing){ if(objectsDiffer(existing, data)){ Object.assign(existing, data); updated++; } else { unchanged++; } }
        else { stockOpnameList.push(Object.assign({id: nextStockOpnameId++, sub_rayon_id: subRayonIdWajib(), input_by: state.user.username}, data)); added++; }
      }
      showToast(added+' baris data baru ditambahkan, '+updated+' baris data diperbarui (ada perbedaan), '+unchanged+' baris data tidak berubah (data sama persis).');
      render();
    });
  };
  inp.click();
}

function backupDataClick(){
  const data = buildBackupObject();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  function pad(n){ return String(n).padStart(2,'0'); }
  const now = new Date();
  const tglBulanTahun = pad(now.getDate())+'-'+pad(now.getMonth()+1)+'-'+now.getFullYear();
  const waktu = pad(now.getHours())+'.'+pad(now.getMinutes())+'.'+pad(now.getSeconds());
  const filename = 'Data Backup_'+state.tahunAnggaran+'_'+tglBulanTahun+'_'+waktu+'.json';
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast('Backup "'+filename+'" berhasil diunduh (termasuk Data Tahun berjalan dan seluruh arsip tahun sebelumnya).');
}

function pilihFileRestore(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function(){
    const file = inp.files[0];
    if(!file) return;
    if(!/\.json$/i.test(file.name)){ showToast('File harus berformat .json.'); return; }
    const reader = new FileReader();
    reader.onload = function(ev){
      let parsed;
      try { parsed = JSON.parse(ev.target.result); }
      catch(e){ showToast('File rusak atau bukan format backup yang valid.'); return; }
      if(!parsed || !parsed._meta || parsed._meta.app !== 'SISR Cibadak'){ showToast('File ini bukan file Backup SISR Cibadak yang valid.'); return; }
      state.restorePendingData = parsed;
      state.restorePendingFilename = file.name;
      state.confirmingRestore = true;
      render();
    };
    reader.readAsText(file);
  };
  inp.click();
}

function batalRestore(){ state.confirmingRestore = false; state.restorePendingData = null; state.restorePendingFilename = ''; render(); }

function replaceArray(arr, newArr){ arr.length = 0; (newArr||[]).forEach(function(x){ arr.push(x); }); }
function konfirmasiRestoreClick(){
  const d = state.restorePendingData;
  if(!d) return;

  function replaceObject(obj, newObj){ Object.keys(obj).forEach(function(k){ delete obj[k]; }); Object.assign(obj, newObj||{}); }

  replaceArray(subRayons, d.subRayons);
  replaceArray(sekolahList, d.sekolahList);
  replaceArray(ptkList, d.ptkList);
  replaceObject(ptkArchiveByYear, d.ptkArchiveByYear);
  replaceArray(operatorList, d.operatorList);
  replaceArray(sertifikasiList, d.sertifikasiList);
  replaceArray(lampiran2a, d.lampiran2a);
  replaceArray(lampiran2b, d.lampiran2b);
  replaceArray(lampiran2c, d.lampiran2c);
  replaceArray(trashList, d.trashList);
  replaceArray(riwayatTahunBaru, d.riwayatTahunBaru);
  if(d.adminMenuAccessByJabatan) replaceObject(adminMenuAccessByJabatan, d.adminMenuAccessByJabatan);
  if(d.superadminAccounts) replaceArray(superadminAccounts, d.superadminAccounts);
  if(d.adminAccounts) replaceArray(adminAccounts, d.adminAccounts);
  if(d.userManuals) replaceArray(userManuals, d.userManuals);
  if(d.bospEntries) replaceArray(bospEntries, d.bospEntries);
  if(d.bkuEntries) replaceArray(bkuEntries, d.bkuEntries);
  if(d.bkuSaldoAwal) replaceObject(bkuSaldoAwal, d.bkuSaldoAwal);
  if(d.bkuSaldoKas) replaceObject(bkuSaldoKas, d.bkuSaldoKas);
  if(d.laporanBpkList) replaceArray(laporanBpkList, d.laporanBpkList);
  if(d.penerimaanBospList) replaceArray(penerimaanBospList, d.penerimaanBospList);
  if(d.pajakDataByUser) replaceObject(pajakDataByUser, d.pajakDataByUser);
  if(d.stockOpnameList) replaceArray(stockOpnameList, d.stockOpnameList);
  if(d.informasiList) replaceArray(informasiList, d.informasiList);

  if(d.counters){
    nextIdOperator = d.counters.nextIdOperator || 1;
    nextIdSertifikasi = d.counters.nextIdSertifikasi || 1;
    nextId2a = d.counters.nextId2a || 1;
    nextId2b = d.counters.nextId2b || 1;
    nextId2c = d.counters.nextId2c || 1;
    nextTrashId = d.counters.nextTrashId || 1;
    nextPtkRowId = d.counters.nextPtkRowId || 1;
    nextSekolahRowId = d.counters.nextSekolahRowId || 1;
    nextSuperadminAccountId = d.counters.nextSuperadminAccountId || 1;
    nextAdminAccountId = d.counters.nextAdminAccountId || 1;
    nextInformasiId = d.counters.nextInformasiId || 1;
    nextUserManualId = d.counters.nextUserManualId || 1;
    nextBospId = d.counters.nextBospId || 1;
    nextBkuId = d.counters.nextBkuId || 1;
    nextLaporanBpkId = d.counters.nextLaporanBpkId || 1;
    nextPenerimaanBospId = d.counters.nextPenerimaanBospId || 1;
    nextStockOpnameId = d.counters.nextStockOpnameId || 1;
  }
  // Pengaman tambahan: pastikan counter TIDAK PERNAH lebih kecil dari ID tertinggi yang benar-benar ada di data
  // (melindungi dari file backup lama/rusak yang counternya belum lengkap, mencegah tabrakan ID).
  function maxIdPlus1(list, field){
    let max = 0;
    (list||[]).forEach(function(x){ const v = parseInt(x[field],10); if(!isNaN(v) && v>max) max = v; });
    return max+1;
  }
  nextIdOperator = Math.max(nextIdOperator, maxIdPlus1(operatorList,'id'));
  nextIdSertifikasi = Math.max(nextIdSertifikasi, maxIdPlus1(sertifikasiList,'id'));
  nextId2a = Math.max(nextId2a, maxIdPlus1(lampiran2a,'id'));
  nextId2b = Math.max(nextId2b, maxIdPlus1(lampiran2b,'id'));
  nextId2c = Math.max(nextId2c, maxIdPlus1(lampiran2c,'id'));
  nextTrashId = Math.max(nextTrashId, maxIdPlus1(trashList,'id'));
  nextBospId = Math.max(nextBospId, maxIdPlus1(bospEntries,'id'));
  nextBkuId = Math.max(nextBkuId, maxIdPlus1(bkuEntries,'id'));
  nextLaporanBpkId = Math.max(nextLaporanBpkId, maxIdPlus1(laporanBpkList,'id'));
  nextPenerimaanBospId = Math.max(nextPenerimaanBospId, maxIdPlus1(penerimaanBospList,'id'));
  nextStockOpnameId = Math.max(nextStockOpnameId, maxIdPlus1(stockOpnameList,'id'));
  nextSuperadminAccountId = Math.max(nextSuperadminAccountId, maxIdPlus1(superadminAccounts,'id'));
  nextAdminAccountId = Math.max(nextAdminAccountId, maxIdPlus1(adminAccounts,'id'));
  nextInformasiId = Math.max(nextInformasiId, maxIdPlus1(informasiList,'id'));
  nextUserManualId = Math.max(nextUserManualId, maxIdPlus1(userManuals,'id'));
  nextPtkRowId = Math.max(nextPtkRowId, maxIdPlus1(ptkList,'_rowId'));
  nextSekolahRowId = Math.max(nextSekolahRowId, maxIdPlus1(sekolahList,'_rowId'));
  tahunBaruSudahDiproses = !!d.tahunBaruSudahDiproses;
  state.tahunAnggaran = d.tahunAnggaran || state.tahunAnggaran;
  state.tahunPelajaran = d.tahunPelajaran || state.tahunPelajaran;
  replaceObject(state.formatSuratInfo, d.formatSuratInfo);
  replaceObject(state.nomorSuratMap, d.nomorSuratMap);
  replaceObject(state.editedSuratMap, d.editedSuratMap);

  state.confirmingRestore = false;
  state.restorePendingData = null;
  const filename = state.restorePendingFilename;
  state.restorePendingFilename = '';
  showToast('Restore dari file "'+filename+'" berhasil. Semua data (termasuk arsip tahun-tahun sebelumnya) sudah dipulihkan.');
  render();
}

function downloadWorkbook(workbook, filename){
  workbook.xlsx.writeBuffer().then(function(buffer){
    const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('File Excel "'+filename+'" berhasil diunduh.');
  }).catch(function(err){
    showToast('Gagal membuat file Excel: '+err.message);
  });
}

function exportRefSekolah(filterKey, list){
  const npsn = state[filterKey] || (list[0] && list[0].sekolah_npsn) || (list[0] && list[0].tempat_tugas) || (scopedSekolah()[0] && scopedSekolah()[0].npsn);
  const sekolah = npsn ? sekolahList.find(function(s){return s.npsn===npsn;}) : null;
  const subRayon = sekolah ? subRayons.find(function(sr){return sr.id===sekolah.sub_rayon_id;}) : null;
  return {sekolah: sekolah, subRayon: subRayon};
}

function styleTitleCell(cell){
  cell.font = {bold:true, size:12};
  cell.alignment = {vertical:'middle'};
}
function styleHeaderCell(cell){
  cell.font = {bold:true};
  cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
  cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFF2F2F2'}};
  cell.border = THIN_BORDER;
}
function styleDataCell(cell, opts){
  opts = opts || {};
  cell.border = THIN_BORDER;
  cell.alignment = {vertical:'middle', horizontal: opts.center ? 'center' : (opts.right ? 'right' : 'left'), wrapText:true};
  if(opts.text) cell.numFmt = '@';
}

// Baris tanda tangan: Pengawas Pembina di KOLOM B, Kepala Sekolah di kolom `signCol` (huruf).
// Tanpa garis titik-titik lagi — langsung spasi kosong lalu nama tercetak (dengan garis bawah) & NIP.
function addSignatureRows(sheet, sekolah, signColLetter){
  function row(leftText, rightText, opts){
    opts = opts || {};
    const r = sheet.addRow([]);
    const cB = r.getCell('B'); cB.value = leftText || ''; cB.font = opts.bold ? {bold:true} : undefined;
    if(opts.underline) cB.border = {bottom:{style:'thin'}};
    const cR = r.getCell(signColLetter); cR.value = rightText || ''; cR.font = opts.bold ? {bold:true} : undefined;
    if(opts.underline) cR.border = {bottom:{style:'thin'}};
    return r;
  }
  sheet.addRow([]);
  row('Mengetahui/Menyetujui :', 'Sukabumi,      '+state.tahunAnggaran);
  row('Pengawas Pembina', 'Kepala Sekolah');
  sheet.addRow([]); sheet.addRow([]); sheet.addRow([]);
  row(sekolah?sekolah.nama_pengawas_pembina:'', sekolah?sekolah.nama_kepala_sekolah:'', {bold:true, underline:true});
  row('NIP. '+(sekolah?sekolah.nip_pengawas_pembina:''), 'NIP. '+(sekolah?sekolah.nip_kepala_sekolah:''));
}

function unduhLampiranPdfGeneric(judul, headers, rows, namaFile){
  if(typeof window.jspdf==='undefined'){ showToast('Library PDF belum selesai dimuat. Tunggu beberapa detik lalu coba lagi.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'cm', format:[33,21.5]});
  const marginCm = 1.5;
  doc.setFontSize(11); doc.setFont(undefined,'bold');
  doc.text(judul, doc.internal.pageSize.getWidth()/2, marginCm, {align:'center'});
  const body = rows.length ? rows : [['Belum ada data.'].concat(Array(headers.length-1).fill(''))];
  doc.autoTable({
    head: [headers], body: body, startY: marginCm+0.6,
    margin: {left:marginCm, right:marginCm, top:marginCm, bottom:marginCm},
    styles: {fontSize:7, cellPadding:1.2, lineColor:[0,0,0], lineWidth:0.02, overflow:'linebreak', valign:'middle'},
    headStyles: {fillColor:[240,240,240], textColor:[0,0,0], fontStyle:'bold', halign:'center', valign:'middle', fontSize:7, overflow:'linebreak'},
    theme: 'grid', tableWidth: 'auto', horizontalPageBreak: false,
  });
  doc.save(namaFile);
}

async function cobaPulihkanSesi(){
  let sesi;
  try { sesi = JSON.parse(sessionStorage.getItem('sisrSesi')); } catch(e){ return; }
  if(!sesi || !sesi.username || !sesi.role) return;
  try {
    const daftar = await api.get(sesi.role==='superadmin' ? '/akun/superadmin' : '/akun/admin');
    const userData = daftar.find(function(a){ return a.username === sesi.username; });
    if(!userData){ sessionStorage.removeItem('sisrSesi'); return; } // akun sudah dihapus/tidak ada lagi
    // state.user WAJIB di-set SEBELUM muatDataAwal() dipanggil (beberapa pemanggilan API
    // di dalamnya butuh state.user.username sudah tersedia), baru loginAs() difinalisasi setelahnya.
    state.user = Object.assign({username: sesi.username, role: sesi.role, sub_rayon_id: userData.sub_rayon_id||null}, userData);
    state.loadingAwal = true;
    render();
    await muatDataAwal();
    state.loadingAwal = false;
    loginAs(sesi.username, userData);
  } catch(e){
    // Gagal pulihkan sesi (misal koneksi bermasalah) -- biarkan saja tampil layar login biasa, jangan menghalangi.
    state.loadingAwal = false;
    state.user = null;
  }
}
async function mulaiAplikasi(){
  const el = document.getElementById('app');
  el.innerHTML = '<div class="d-flex align-items-center justify-content-center" style="height:100vh;"><div class="text-center"><div class="spinner-border text-primary mb-3" role="status"></div><div>Menyiapkan aplikasi...</div></div></div>';
  try {
    const status = await api.get('/setup-status');
    state.perluSetupAwal = !!status.perluSetupAwal;
    try { applyAppSettings(await api.get('/pengaturan-tampilan')); } catch(e){ /* pengaturan gagal dimuat -- lanjut pakai tampilan bawaan */ }
  } catch(err){
    // Backend/database belum siap (biasanya hanya sesaat setelah aplikasi baru dibuka) -- coba lagi sebentar.
    el.innerHTML = '<div class="d-flex align-items-center justify-content-center" style="height:100vh;"><div class="text-center"><div class="spinner-border text-primary mb-3" role="status"></div><div>Menunggu database siap...</div></div></div>';
    setTimeout(mulaiAplikasi, 1500);
    return;
  }
  if(!state.perluSetupAwal){
    await cobaPulihkanSesi();
  }
  render();
}
mulaiAplikasi();
