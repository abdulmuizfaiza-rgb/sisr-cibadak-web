  .sidebar-brand {
    display: flex; align-items: center; gap: 10px; padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.12); font-weight: 700; font-size: 16px; color: #fff;
  }
  .sidebar-brand .logo-badge {
    width: 34px; height: 34px; border-radius: 8px; background: var(--primary);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .sidebar-nav { flex: 1; padding: 14px 12px; overflow-y: auto; }
  .nav-item-custom {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px;
    color: #d7dde8; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 2px;
  }
  .nav-item-custom:hover { background: rgba(255,255,255,0.1); }
  .nav-item-custom.active { background: rgba(32,107,196,0.55); color: #fff; }
  .nav-item-custom i { font-size: 17px; width: 18px; text-align: center; }
  .nav-sub-item {
    display: flex; align-items: center; padding: 7px 12px 7px 40px; border-radius: 8px;
    color: #aab4c4; font-size: 13.5px; cursor: pointer; margin-bottom: 1px;
  }
  .nav-sub-item:hover { background: rgba(255,255,255,0.1); }
  .nav-sub-item.active { background: rgba(32,107,196,0.55); color: #fff; font-weight: 500; }
  .nav-sub-item-2 {
    display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 6px 52px; border-radius: 8px;
    color: #98a2b3; font-size: 13px; cursor: pointer; margin-bottom: 1px;
  }
  .nav-sub-item-2:hover { background: rgba(255,255,255,0.1); }
  .nav-sub-item-2.active { background: rgba(32,107,196,0.5); color: #fff; font-weight: 500; }
  .sidebar-footer { padding: 12px; border-top: 1px solid rgba(255,255,255,0.12); }
  .topbar {
    background: #fff; border-bottom: 1px solid #e6e8ec; padding: 14px 28px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar h5 { margin: 0; font-weight: 600; font-size: 17px; color: #1a2536; }
  .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .content-body { padding: 24px 28px; }
  .avatar-circle {
    width: 36px; height: 36px; border-radius: 50%; background: var(--primary-light);
    color: var(--primary); display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px;
  }
  .card { border: 1px solid #e6e8ec; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .stat-card { border: 1px solid #e6e8ec; border-radius: 10px; padding: 16px 18px; background: #fff; }
  .stat-card .stat-label { font-size: 12.5px; color: #6b7686; margin-bottom: 6px; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; color: #1a2536; }
  .btn-primary { background: var(--primary); border-color: var(--primary); }
  .btn-primary:hover { background: #1a5aa8; border-color: #1a5aa8; }
  .btn-outline-primary { color: var(--primary); border-color: var(--primary); }
  .badge-soon { font-size: 10px; background: #eef0f3 !important; color: #8a93a3 !important; }
  #searchResults { max-height: 240px; overflow-y: auto; z-index: 1000; border: 1px solid #e6e8ec; }
  .list-group-item { cursor: pointer; border-color: #eef0f3; }
  .table thead th { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.03em; color: #6b7686; border-bottom-width: 1px; background: #f9fafb; text-align: center; }
  .bosp-table thead th { text-transform: none !important; font-size: 10.5px !important; letter-spacing: normal !important; }
  .informasi-marquee-bar { background: #fdecea; border-bottom: 2px solid #dc3545; overflow: hidden; white-space: nowrap; padding: 8px 0; }
  .informasi-marquee-track { display: inline-block; padding-left: 100%; color: #c0392b; font-weight: 700; font-size: 14px; animation: informasi-scroll 25s linear infinite; }
  .informasi-marquee-track:hover { animation-play-state: paused; }
  @keyframes informasi-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  .bosp-table tbody td { font-size: 11.5px !important; }
  .table td { font-size: 14px; vertical-align: middle; }
  .table, .table th, .table td { border: 2px solid #000 !important; }
  .table { border-collapse: collapse !important; }
  .table-scroll { max-height: 420px; overflow-y: auto; overflow-x: auto; border: 1px solid #e6e8ec; border-radius: 8px; }
  .table-scroll table { margin-bottom: 0; }
  .table-scroll thead th { position: sticky; top: 0; background: #f9fafb; z-index: 1; }
  .table-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .table-scroll::-webkit-scrollbar-track { background: #f1f2f4; }
  .table-scroll::-webkit-scrollbar-thumb { background: #c3c9d1; border-radius: 6px; }
  .table-scroll::-webkit-scrollbar-thumb:hover { background: #a4acb8; }

<div id="app"></div>

<script>
// ============================================================
// API CLIENT — Menghubungkan aplikasi ke backend PostgreSQL sungguhan.
// Semua array di bawah (sekolahList, ptkList, dst.) tetap dipertahankan sebagai
// CACHE LOKAL supaya seluruh kode render/validasi yang sudah ada & teruji TIDAK
// perlu ditulis ulang -- hanya titik-titik mutasi (tambah/edit/hapus) yang
// disambungkan ke API di bawah ini.
// ============================================================
const API_BASE = (window.SISR_API_BASE || '') + '/api';
let apiOffline = false;

async function apiCall(method, path, body){
  try {
    const res = await fetch(API_BASE + path, {
      method: method,
      headers: body !== undefined ? {'Content-Type':'application/json'} : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    apiOffline = false;
    if(res.status === 204) return null;
    const data = await res.json().catch(function(){ return null; });
    if(!res.ok){
      const err = new Error((data && data.error) || ('Kesalahan server ('+res.status+')'));
      err.status = res.status;
      err.apiError = true;
      throw err;
    }
    return data;
  } catch(e){
    if(!e.apiError){
      apiOffline = true;
      const errKoneksi = new Error('Tidak bisa terhubung ke database. Pastikan aplikasi backend & PostgreSQL sedang berjalan.');
      errKoneksi.isConnectionError = true;
      throw errKoneksi;
    }
    throw e;
  }
}
const api = {
  get: function(path){ return apiCall('GET', path); },
  post: function(path, body){ return apiCall('POST', path, body); },
  patch: function(path, body){ return apiCall('PATCH', path, body); },
  put: function(path, body){ return apiCall('PUT', path, body); },
  del: function(path, body){ return apiCall('DELETE', path, body); },
};

// Menampilkan error API sebagai toast yang jelas, dipakai di semua pemanggil try/catch
function tampilkanErrorApi(err){
  showToast(err.message || 'Terjadi kesalahan saat menghubungi server.');
}

// Dipakai di semua fungsi "Tambah Data" sebagai pengganti "subRayonIdWajib()".

function subRayonIdWajib(){
  if(state.user.sub_rayon_id) return state.user.sub_rayon_id;

function getUserRecord(username){
  const sa = superadminAccounts.find(function(a){return a.username===username;});

function namaSekolah(npsn){ const s = sekolahList.find(function(x){return x.npsn===npsn;}); return s? s.nama_sekolah : '-'; }
function rupiah(n){ return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }
function esc(s){ return (s===undefined||s===null?'':s).toString().replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
function fmtTgl(iso){ if(!iso) return '-'; const p = iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function selectOpts(options, selected){ return options.map(function(o){ return '<option'+(o===selected?' selected':'')+'>'+o+'</option>'; }).join(''); }

function cropImageToRatio(dataUrl, ratio, outW, outH, callback){
  if(typeof Image==='undefined'){ callback(dataUrl); return; }
  const img = new Image();
  img.onload = function(){
    let sw = img.width, sh = img.height, sx = 0, sy = 0, cropW, cropH;
    if(sw/sh > ratio){ cropH = sh; cropW = sh*ratio; sx = (sw-cropW)/2; }
    else { cropW = sw; cropH = sw/ratio; sy = (sh-cropH)/2; }
    const canvas = document.createElement('canvas');
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext && canvas.getContext('2d');
    if(!ctx){ callback(dataUrl); return; }
    ctx.drawImage(img, sx, sy, cropW, cropH, 0, 0, outW, outH);
    callback(canvas.toDataURL('image/jpeg', 0.9));
  };
  img.onerror = function(){ callback(dataUrl); };
  img.src = dataUrl;
}
function resizeDanKompresLogo(dataUrl, outW, outH, maxBytes, callback){
  if(typeof Image==='undefined'){ callback(dataUrl); return; }
  const img = new Image();
  img.onload = function(){
    const canvas = document.createElement('canvas');
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext && canvas.getContext('2d');
    if(!ctx){ callback(dataUrl); return; }
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,outW,outH);
    const scale = Math.min(outW/img.width, outH/img.height);
    const dw = img.width*scale, dh = img.height*scale;
    ctx.drawImage(img, (outW-dw)/2, (outH-dh)/2, dw, dh);
    let quality = 0.92;
    function tryCompress(){
      const out = canvas.toDataURL('image/jpeg', quality);
      const approxBytes = Math.ceil((out.length - 23) * 3/4);
      if(approxBytes <= maxBytes || quality <= 0.3){ callback(out); return; }
      quality -= 0.1;
      tryCompress();
    }
    tryCompress();
  };
  img.onerror = function(){ callback(dataUrl); };
  img.src = dataUrl;
}

async function handleLoginClick(expectedRole){
  const username = val('loginUsername').trim();
  const password = val('loginPassword');
  let userData;
  try {
    userData = await api.post('/auth/login', {username: username, password: password, role: expectedRole});
  } catch(err){
    if(err.isConnectionError){ tampilkanErrorApi(err); return; }
    failedLoginAttempts[username] = (failedLoginAttempts[username]||0) + 1;
    if(failedLoginAttempts[username] >= 2){
      const u = getUserRecord(username);
      tampilkanPopupPemulihan(username, u ? u.password : DEFAULT_PASSWORD);
    } else {
      showToast('Username atau password salah.');
    }
    return;
  }
  failedLoginAttempts[username] = 0;
  state.recoveryPopup = null;
  const tahunInput = document.getElementById('loginTahun');
  const selectedYear = tahunInput ? tahunInput.value : state.tahunAnggaran;
  state.viewingYear = (selectedYear !== state.tahunAnggaran) ? selectedYear : null;
  const role = userData.jabatan !== undefined ? 'admin' : 'superadmin';
  state.user = Object.assign({username: username, role: role, sub_rayon_id: userData.sub_rayon_id||null}, userData);
  state.loadingAwal = true;
  render();
  try {
    await muatDataAwal();
  } catch(err){
    state.loadingAwal = false;
    state.user = null;
    tampilkanErrorApi(err);
    render();
    return;
  }
  state.loadingAwal = false;
  loginAs(username, userData);
}

function adaVerifikasiSaldoTidakSama(){
  if(typeof laporanBpkList==='undefined' || !state.user) return false;
  const list = laporanBpkList.filter(function(x){ return state.user.role==='superadmin' || x.input_by===state.user.username; });
  return list.some(function(x){
    const saldoAwal = saldoAwalLaporanBpk(x.triwulan, x.npsn, x.input_by);
    const penerimaan = penerimaanDanaBosLaporanBpk(x.triwulan, x.npsn);
    const totalPenerimaan = saldoAwal + penerimaan;
    const kategoriTotals = LAPORAN_BPK_KATEGORI_MAP.map(function(k){ return kategoriTotalLaporanBpk(k.code, x.triwulan, x.input_by); });
    const belanjaBarangHabisPakai = kategoriTotals[0];
    const totalBarangJasa = kategoriTotals.slice(1,9).reduce(function(s,v){return s+v;},0);
    const totalModal = kategoriTotals.slice(9,11).reduce(function(s,v){return s+v;},0);
    const totalRealisasi = belanjaBarangHabisPakai + totalBarangJasa + totalModal;
    const sisaDanaBos = totalPenerimaan - totalRealisasi;
    const keteranganSaldo = (x.saldo_rekening_bank||0) + (x.saldo_kas_tunai||0);
    return sisaDanaBos !== keteranganSaldo;
  });
}

function moveToTrash(sourceType, data, label, reason){
  // Untuk sekolah/operator/ptk, backend SUDAH otomatis mengisi trash server-side saat hapus.

  trashList.push({

function computeTahunBaruPreview(){
  const nrgs2a = lampiran2a.filter(function(d){return d.triwulan===4;}).map(function(d){return d.nrg;});
  const nrgs2c = lampiran2c.filter(function(d){return d.triwulan===4;}).map(function(d){return d.nrg;});
  const keepSet = {};
  nrgs2a.concat(nrgs2c).forEach(function(nrg){ keepSet[nrg] = true; });
  const willKeep = ptkList.filter(function(p){ return keepSet[p.nrg] && p.status_keaktifan==='Aktif'; });
  const willDrop = ptkList.filter(function(p){ return !(keepSet[p.nrg] && p.status_keaktifan==='Aktif'); });
  return {willKeep: willKeep, willDrop: willDrop};
}

  render();
}

    const inScope = state.user.role==='superadmin' || x.input_by===state.user.username;
    const ptk = ptkList.find(function(p){return p.nrg===x.nrg;});
    return inScope && x.triwulan===tw-1 && (!ptk || ptk.status_keaktifan==='Tidak Aktif');
  }).length;
  if(sourceItems.length===0 && dilewati===0){ showToast('Tidak ada data di Triwulan '+(tw-1)+' untuk disalin.'); return; }
  sourceItems.forEach(function(item){
    const copy = Object.assign({}, item, {triwulan: tw, input_by: state.user.username});
    if(type==='2a'){ copy.id = nextId2a++; lampiran2a.push(copy); }
    else if(type==='2b'){ copy.id = nextId2b++; lampiran2b.push(copy); }
    else { copy.id = nextId2c++; lampiran2c.push(copy); }
  });
  let pesan = sourceItems.length+' data berhasil disalin dari Triwulan '+(tw-1)+' ke Triwulan '+tw+'.';
  if(dilewati>0) pesan += ' ('+dilewati+' data dilewati karena PTK berstatus Tidak Aktif.)';
  showToast(pesan);
  render();
}

function setupDelegation(){
  const app = document.getElementById('app');
  if(!app || app.dataset.delegated) return;
  app.dataset.delegated = '1';

  app.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    e.preventDefault();
    if(el.dataset.stop) e.stopPropagation();
    const action = el.dataset.action;
    const args = el.dataset.args ? JSON.parse(el.dataset.args) : [];
    if(typeof ACTIONS[action] === 'function') ACTIONS[action].apply(null, args);
  });

  app.addEventListener('paste', function(e){
    const el = e.target;
    if(!el.classList) return;
    const isStockOpname = el.classList.contains('stockopname-paste-cell');
    const isBospInline = el.classList.contains('bosp-inline-paste-cell');
    const isOpsInline = el.classList.contains('ops-inline-paste-cell');
    if(!isStockOpname && !isBospInline && !isOpsInline) return;
    const clip = e.clipboardData || window.clipboardData;
    const text = clip ? clip.getData('text') : '';
    if(!text) return;
    e.preventDefault();
    if(text.indexOf('\t')>-1){
      if(isStockOpname) state.stockOpnamePasteWarning = true; else state.bospInlinePasteWarning = true;
      render();
      return;
    }
    const lines = text.split(/\r\n|\r|\n/).filter(function(l, idx, arr){ return !(idx===arr.length-1 && l===''); });
    if(lines.length===0) return;
    if(isStockOpname) tempelDataStockOpname(el.dataset.pasteRowId, el.dataset.pasteField, lines);
    else if(isOpsInline) tempelDataOpsInline(el.dataset.pasteSource, el.dataset.pasteRowId, el.dataset.pasteField, lines);
    else {
      const kodeKat = el.dataset.pasteKategori;
      const twKat = parseInt(el.dataset.pasteTw,10);
      if(BOSP_BARANG_KATEGORI_LIST.indexOf(kodeKat)>-1) tempelDataBospBarangInline(kodeKat, twKat, el.dataset.pasteRowId, el.dataset.pasteField, lines);
      else if(kodeKat==='jasa_pendidik_tendik') tempelDataBospJasaPendidikInline(twKat, el.dataset.pasteRowId, el.dataset.pasteField, lines);
      else tempelDataBospInline(kodeKat, twKat, el.dataset.pasteRowId, el.dataset.pasteField, lines);
    }
  });

  app.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.classList && e.target.classList.contains('pajak-input')){
      e.preventDefault();
      const nav = e.target.dataset.pajakNav;
      if(!nav) return;
      const parts = nav.split(':');
      const sisi = parts[1], field = parts[2];
      let bulan = parseInt(parts[0],10) + 1;
      while(bulan<=11){
        const nextEl = document.getElementById('pajakCell_'+bulan+'_'+sisi+'_'+field);
        if(nextEl && !nextEl.disabled){ nextEl.focus(); nextEl.select && nextEl.select(); return; }
        bulan++;
      }
    }
  });

  app.addEventListener('input', function(e){
    const el = e.target;
    if(el.dataset && el.dataset.onInput){
      const fn = el.dataset.onInput;
      if(fn === 'searchQ2a'){ state.searchQ2a = el.value; render(); }
      else if(fn === 'searchQ2b'){ state.searchQ2b = el.value; render(); }
      else if(fn === 'searchQ2c'){ state.searchQ2c = el.value; render(); }
      else if(fn === 'searchQSert'){ state.searchQSert = el.value; render(); }
      else if(fn === 'fmtGaji'){ fmtGajiInput(el); }
      else if(fn === 'hitungBosp'){ hitungBosp(); }
      else if(fn === 'hitungJumlahGaji'){ hitungJumlahGaji(); }
      else if(fn === 'hitungJumlahDayaJasa'){ hitungJumlahDayaJasa(); }
      else if(fn === 'hitungTotalHargaBarang'){ hitungTotalHargaBarang(); }
      else if(fn === 'hitungTotalHargaKomputer'){ hitungTotalHargaKomputer(); }
      else if(fn === 'hitungTotalHargaJasaPemeliharaan'){ hitungTotalHargaJasaPemeliharaan(); }
      else if(fn === 'hitungTotalJasaPemeliharaanUpk'){ hitungTotalJasaPemeliharaanUpk(); }
      else if(fn === 'hitungJumlahBiayaLomba'){ hitungJumlahBiayaLomba(); }
      else if(fn === 'hitungJumlahHonorKegiatan'){ hitungJumlahHonorKegiatan(); }
      else if(fn === 'hitungJumlahMamin'){ hitungJumlahMamin(); }
      else if(fn === 'hitungJumlahPerjalananDinas'){ hitungJumlahPerjalananDinas(); }
      else if(fn.indexOf('hitungTotalBarangKategori_')===0 && typeof ACTIONS[fn]==='function'){ ACTIONS[fn](); }
      else if(fn === 'hitungPenerimaanBosp'){ hitungPenerimaanBosp(); }
      else if(fn.indexOf('fmtBkuSaldoAwal:')===0){ fmtBkuSaldoAwal(fn.slice('fmtBkuSaldoAwal:'.length)); }
      else if(fn.indexOf('fmtBkuSaldoKas:')===0){
        const parts = fn.slice('fmtBkuSaldoKas:'.length).split(':');
        fmtBkuSaldoKas(parts[0], parts[1], parts[2]);
      }
      else if(fn.indexOf('filter:')===0){ state[fn.slice(7)] = el.value; render(); }
    }
  });

  // Registrasi: begitu fokus pindah dari NPSN, otomatis isi Username = NPSN dan kunci (tidak lewat render()
  // supaya field lain yang sudah diisi tidak ikut ter-reset).
  app.addEventListener('focusout', function(e){
    const el = e.target;
    if(el && el.id === 'regNpsn'){
      const usernameEl = document.getElementById('regUsername');
      const npsn = el.value.trim();
      if(usernameEl && npsn){
        const dipakai = function(u){ return superadminAccounts.some(function(a){return a.username===u;}) || adminAccounts.some(function(a){return a.username===u;}); };
        let kandidat = npsn;
        let n = 2;
        while(dipakai(kandidat)){ kandidat = npsn+'-'+n; n++; }
        usernameEl.value = kandidat;
        usernameEl.readOnly = true;
        usernameEl.classList.add('bg-light');
      }
    }
  });

  app.addEventListener('change', function(e){
    const el = e.target;
    if(el.id==='opJabatan' || el.id==='regJabatan'){
      const namaAdminBospId = el.id==='opJabatan' ? 'opNamaAdminBosp' : 'regNamaAdminBosp';
      const namaAdminBospEl = document.getElementById(namaAdminBospId);
      if(namaAdminBospEl){
        if(el.value==='Bendahara/Admin BOSP'){
          namaAdminBospEl.disabled = false;
          namaAdminBospEl.focus();
        } else {
          namaAdminBospEl.value = '';
          namaAdminBospEl.disabled = true;
          const unitKerjaEl = document.getElementById('opUnitKerja');
          if(el.id==='opJabatan' && unitKerjaEl) unitKerjaEl.focus();
        }
      }
      return;
    }
    if(el.type==='file' && el.dataset && el.dataset.fileKey==='pengaturan_logo'){
      const file = el.files && el.files[0];
      if(!file) return;
      if(!/^image\//.test(file.type)){ showToast('File harus berupa gambar.'); return; }
      if(file.size > 1024*1024*3){ showToast('Ukuran logo maksimal 3 MB.'); return; }
      const reader = new FileReader();
      reader.onload = function(ev){
        pengaturanTampilanTemp.logo = ev.target.result;
        // Update pratinjau langsung TANPA render() penuh, supaya warna/ukuran huruf yang sudah dipilih tidak ikut hilang.
        const container = el.previousElementSibling;
        if(container) container.innerHTML = '<img src="'+ev.target.result+'" style="width:64px;height:64px;object-fit:contain;border-radius:8px;border:1px solid #e6e8ec;">';
      };
      reader.readAsDataURL(file);
      return;
    }
    if(el.type==='file' && el.dataset && el.dataset.fileKey==='pengaturan_login_bg'){
      const file = el.files && el.files[0];
      if(!file) return;
      if(!/^image\//.test(file.type)){ showToast('File harus berupa gambar.'); return; }
      if(file.size > 1024*1024*5){ showToast('Ukuran gambar maksimal 5 MB.'); return; }
      const reader = new FileReader();
      reader.onload = function(ev){
        pengaturanTampilanTemp.login_background = ev.target.result;
        // Update pratinjau langsung TANPA render() penuh, supaya warna/ukuran huruf yang sudah dipilih tidak ikut hilang.

      };
      reader.readAsDataURL(file);
      return;
    }
    if(el.type==='file' && el.dataset && el.dataset.fileKey==='user_manual_pdf'){
      const file = el.files && el.files[0];
      if(!file) return;
      if(!/\.pdf$/i.test(file.name)){ showToast('File harus berformat .pdf.'); return; }

        tempFiles.user_manual_pdf_name = file.name;
        tempFiles.user_manual_pdf_size = Math.round(file.size/1024);
        // Update tampilan langsung TANPA render() penuh, supaya field Nama/Tanggal yang sudah diisi tidak ikut hilang.
        let msg = el.parentElement.querySelector('.file-ready-msg');
        if(!msg){
          msg = document.createElement('div');
          msg.className = 'file-ready-msg text-success small mt-1';
          el.parentElement.appendChild(msg);
        }
        msg.textContent = 'File siap: '+file.name+' ('+tempFiles.user_manual_pdf_size+' KB)';
      };
      reader.readAsDataURL(file);
      return;
    }
    if(el.type==='file' && el.dataset && el.dataset.fileKey==='format_surat_docx'){
      const file = el.files && el.files[0];
      if(!file) return;
      if(!/\.(docx|doc)$/i.test(file.name)){ showToast('File harus berformat .docx atau .doc.'); return; }
      if(file.size > 1024*1024*5){ showToast('Ukuran file maksimal 5 MB.'); return; }
      const target = state.formatSuratTarget;
      const label = FORMAT_SURAT_LABELS[target] || target;
      const reader = new FileReader();
      reader.onload = function(ev){
        const entry = { filename: file.name, sizeKb: Math.round(file.size/1024), uploadedAt: new Date().toLocaleString('id-ID'), dataUrl: ev.target.result };
        state.formatSuratInfo[target] = entry;
        api.put('/format-surat', {tahun_anggaran: state.tahunAnggaran, file_docx_target: target, file_docx_entry: entry})
          .then(function(){ showToast('Format "'+label+'" berhasil diupload ('+file.name+') dan langsung aktif dipakai semua Admin SR.'); render(); })
          .catch(function(err){ tampilkanErrorApi(err); render(); });
      };
      reader.readAsDataURL(file);
      return;
    }
    if(el.type==='file' && el.dataset && el.dataset.fileKey==='sk_ops_bendahara'){
      const file = el.files && el.files[0];
      if(!file) return;
      if(file.type!=='application/pdf'){ showToast('Upload SK Operator/Bendahara harus format PDF.'); return; }
      if(file.size > 1024*1024){ showToast('Ukuran file PDF maksimal 1MB.'); return; }

      reader.onload = function(ev){ tempFiles.sk_ops_bendahara = ev.target.result; renderPertahankanForm(); };
      reader.readAsDataURL(file);

    }
    if(el.type==='file' && el.dataset && el.dataset.fileKey==='foto_ops'){

      reader.readAsDataURL(file);
      return;
    }
    if(el.type==='file' && el.dataset && (el.dataset.fileKey==='logo_sekolah' || el.dataset.fileKey==='logo_pemda')){
      const file = el.files && el.files[0];
      if(!file) return;
      if(!/^image\//.test(file.type)){ showToast('File harus berupa gambar.'); return; }
      const key = el.dataset.fileKey;
      const reader = new FileReader();
      reader.onload = function(ev){
        resizeDanKompresLogo(ev.target.result, 300, 300, 1024*1024, function(hasil){ tempFiles[key] = hasil; renderPertahankanForm(); });
      };
      reader.readAsDataURL(file);
      return;
    }
    if(el.type==='file' && el.dataset && el.dataset.fileKey){
      const file = el.files && el.files[0];
      if(!file) return;
      if(!/^image\//.test(file.type)){ showToast('File harus berupa gambar.'); return; }
      if(file.size > 1024*1024*2){ showToast('Ukuran gambar maksimal 2 MB.'); return; }
      const key = el.dataset.fileKey;
      const reader = new FileReader();
      reader.onload = function(ev){
        tempFiles[key] = ev.target.result;
        renderPertahankanForm();
      };
      reader.readAsDataURL(file);
      return;
    }
    if(el.dataset && el.dataset.changeAction){
      const fn = el.dataset.changeAction;
      const fixedArg = el.dataset.changeArg;
      const val = el.type==='checkbox' ? el.checked : el.value;
      if(typeof ACTIONS[fn]==='function'){
        if(fixedArg!==undefined) ACTIONS[fn](fixedArg, val);
        else ACTIONS[fn](val);
      }
      return;
    }
    if(el.dataset && el.dataset.onChange){
      const fn = el.dataset.onChange;
      if(fn.indexOf('filter:')===0){ state[fn.slice(7)] = el.value; render(); }
    }
  });

  app.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.id === 'loginPassword'){
      e.preventDefault();
      handleLoginClick(state.loginTab);
    }
  });

function topLevelMenuForView(view){

  if(view==='profil_sr') return 'profil_sr';
  if(['data_sekolah','data_operator','data_ptk','data_sertifikasi'].indexOf(view)>-1) return 'data_master';
  if(/^(lampiran_2[abc]_tw[1-4]|surat_rekom2a_tw[1-4]|surat_penghentian_tw[1-4]|surat_pernyataan_tw[1-4])$/.test(view)) return 'pemberkasan_tpg';
  if(/^bosp_.+_tw[1-4]$/.test(view)) return 'lpj_bosp';
  if(view==='penerimaan_bosp') return 'lpj_bosp';
  if(view==='laporan_bpk_tahunan') return 'lpj_bosp';
  if(/^unduhan_tw[1-4]$/.test(view)) return 'lpj_bosp';
  if(view==='unduhan_tahunan') return 'lpj_bosp';
  if(view==='pajak_lpj_bosp') return 'lpj_bosp';

}

// Dipakai saat render ulang dipicu oleh hal yang BUKAN perubahan teks (misal: selesai upload gambar/logo)
// supaya field lain di form yang sama yang SUDAH DIKETIK pengguna (tapi belum disimpan ke state)
// tidak ikut hilang/kosong akibat form ditulis ulang dari nol.
// Dipakai setelah proses simpan ASYNC (menunggu server) selesai di tabel-tabel inline (Data Sekolah,
// Operator, PTK, dst). Karena render ulang terjadi SETELAH respons server datang (bukan langsung),
// elemen yang baru saja dituju lewat Tab/klik bisa "hilang" fokusnya begitu tabel digambar ulang.
// Fungsi ini menyimpan elemen mana yang sedang aktif SEBELUM render, lalu mengembalikan fokus
// (dan posisi kursor teks bila memungkinkan) ke elemen yang SAMA setelah tabel selesai digambar ulang.
function renderPertahankanFokus(){
  const aktif = document.activeElement;
  const selectorAktif = (aktif && aktif.dataset && aktif.dataset.changeArg) ? '[data-change-arg="'+aktif.dataset.changeArg+'"]' : null;
  const posisiKursor = (aktif && typeof aktif.selectionStart === 'number') ? aktif.selectionStart : null;
  render();
  if(selectorAktif){
    const elBaru = document.querySelector(selectorAktif);
    if(elBaru){
      elBaru.focus();
      if(posisiKursor!==null && typeof elBaru.setSelectionRange === 'function'){
        try { elBaru.setSelectionRange(posisiKursor, posisiKursor); } catch(e){ /* elemen non-teks, abaikan */ }
      }
    }
  }
}
function renderPertahankanForm(){
  const app = document.getElementById('app');
  const nilaiTersimpan = {};
  if(app){
    app.querySelectorAll('input[id], select[id], textarea[id]').forEach(function(el){
      if(el.type==='file') return;
      nilaiTersimpan[el.id] = el.type==='checkbox' ? el.checked : el.value;
    });
  }
  render();
  Object.keys(nilaiTersimpan).forEach(function(id){
    const el = document.getElementById(id);
    if(!el || el.type==='file') return;
    if(el.type==='checkbox') el.checked = nilaiTersimpan[id];
    else el.value = nilaiTersimpan[id];
  });
}

function render(){
  const el = document.getElementById('app');
  const activeId = document.activeElement ? document.activeElement.id : null;
  const cursorPos = (document.activeElement && document.activeElement.selectionStart!=null) ? document.activeElement.selectionStart : null;

  if(state.loadingAwal){ el.innerHTML = '<div class="d-flex align-items-center justify-content-center" style="height:100vh;"><div class="text-center"><div class="spinner-border text-primary mb-3" role="status"></div><div>Memuat data dari server...</div></div></div>'; return; }
  if(state.perluSetupAwal){ el.innerHTML = viewSetupAwal(); restoreFocus(activeId, cursorPos); return; }
  if(!state.user){ el.innerHTML = viewLogin(); restoreFocus(activeId, cursorPos); return; }

  // Penjagaan akses: kalau belum ganti password, paksa ke Dashboard.
  const uAccountGuard = getUserRecord(state.user.username);
  if(uAccountGuard && uAccountGuard.mustChangePassword && state.view !== 'dashboard'){ state.view = 'dashboard'; }
  // Penjagaan akses: menu superadminOnly tidak boleh diakses Admin SR; menu yang dinonaktifkan Superadmin juga tidak boleh.
  const menuGroupForGuard = topLevelMenuForView(state.view);
  const menuDefForGuard = MENUS.find(function(m){ return m.code === menuGroupForGuard; });
  if(menuDefForGuard && menuDefForGuard.superadminOnly && state.user.role!=='superadmin' && menuGroupForGuard!=='menu_pengguna'){ state.view = 'dashboard'; }
  if(state.user.role==='admin_sr' && menuGroupForGuard!=='dashboard' && currentAdminMenuAccess()[menuGroupForGuard]!==true){ state.view = 'dashboard'; }

  let body = '';
  const twMatch = /^lampiran_(2[abc])_tw([1-4])$/.exec(state.view);
  const suratMatch = /^surat_rekom2a_tw([1-4])$/.exec(state.view);
  const penghentianMatch = /^surat_penghentian_tw([1-4])$/.exec(state.view);
  const pernyataanMatch = /^surat_pernyataan_tw([1-4])$/.exec(state.view);
  const bospMatch = /^bosp_(.+)_tw([1-4])$/.exec(state.view);
  if(state.view==='dashboard') body = viewDashboard();
  else if(state.view==='profil_sr') body = viewProfilSR();
  else if(state.view==='data_sekolah') body = viewDataSekolah();
  else if(state.view==='data_operator') body = viewDataOperator();
  else if(state.view==='data_sertifikasi') body = viewDataSertifikasi();
  else if(state.view==='data_ptk') body = viewDataPtk();
  else if(state.view==='format_surat') body = viewFormatSurat();
  else if(state.view==='arsip_data') body = viewArsipData();
  else if(state.view==='proses_tahun_baru') body = viewProsesTahunBaru();
  else if(state.view==='menu_pengguna') body = viewMenuPengguna();
  else if(state.view==='user_manual') body = viewUserManual();
  else if(state.view==='data_aset_segera') body = viewDataAsetSegera();
  else if(twMatch) body = viewLampiranTriwulan(twMatch[1], parseInt(twMatch[2],10));
  else if(suratMatch) body = viewSuratRekom2a(parseInt(suratMatch[1],10));
  else if(penghentianMatch) body = viewSuratPenghentian(parseInt(penghentianMatch[1],10));
  else if(pernyataanMatch) body = viewSuratPernyataan(parseInt(pernyataanMatch[1],10));
  else if(bospMatch) body = viewBospKategori(bospMatch[1], parseInt(bospMatch[2],10));
  else if(state.view==='penerimaan_bosp') body = viewPenerimaanBosp();
  else if(state.view==='laporan_bpk_tahunan') body = viewLaporanBpkTahunan();
  else if(/^unduhan_tw[1-4]$/.test(state.view)) body = viewUnduhanLpjBosp(parseInt(state.view.slice(-1),10));
  else if(state.view==='unduhan_tahunan') body = viewUnduhanLpjBospTahunan();
  else if(state.view==='pajak_lpj_bosp') body = viewPajakLpjBosp();
  else if(state.view==='informasi_admin') body = viewInformasiAdmin();
  else if(state.view==='pengaturan_tampilan') body = viewPengaturanTampilan();
  else if(state.view==='stock_opname_lpj_bosp') body = viewStockOpname();
  el.innerHTML = layout(body);
  restoreFocus(activeId, cursorPos);
  autoFitPages();
  updatePaperSizeStyle();
}
function restoreFocus(activeId, cursorPos){
  if(!activeId) return;
  const el = document.getElementById(activeId);
  if(el){
    el.focus();
    if(cursorPos!=null && el.setSelectionRange){ try{ el.setSelectionRange(cursorPos, cursorPos); }catch(e){} }
  }
}

function currentLabel(){
  function find(nodes, trail){
    for(const n of nodes){
      const newTrail = trail.concat([n.label]);
      if(n.code===state.view) return newTrail;
      if(n.children){
        const r = find(n.children, newTrail);
        if(r) return r;
      }
    }
    return null;
  }
  const trail = find(MENUS, []);
  return trail ? trail.join(' / ') : '';
}

function act(action, args){
  const a = args!==undefined ? " data-args='"+JSON.stringify(args).replace(/'/g,"&#39;")+"'" : '';
  return 'data-action="'+action+'"'+a;
}

function nodeContainsView(node){
  if(node.code===state.view) return true;
  if(node.children) return node.children.some(nodeContainsView);
  return false;
}

function renderMenuNode(node, level){
  const cls = level===1 ? 'nav-item-custom' : 'nav-sub-item';
  if(node.dropdown){
    const open = nodeContainsView(node);
    const subId = 'subMenu_'+node.code;
    const childrenHtml = node.children.map(function(c){ return renderMenuNode(c, level+1); }).join('');
    const placeholders = (node.placeholders||[]).map(function(txt){
      return '<div class="nav-sub-item-2" style="cursor:default;color:#707a8c;">'+txt+' <span class="badge badge-soon ms-1">Segera</span></div>';
    }).join('');
    return '<div>'
      + '<div class="'+cls+(open?' active':'')+'" '+act('toggleSub',[subId])+' style="justify-content:space-between;">'
      + '<span>'+node.label+'</span>'+(open?ICONS.chevronDown:ICONS.chevronRight)+'</div>'
      + '<div id="'+subId+'" style="display:'+(open?'block':'none')+';">'
      + childrenHtml + placeholders
      + '</div></div>';
  }
  const active = state.view===node.code;
  const itemCls = level>=3 ? 'nav-sub-item-2' : cls;
  return '<div class="'+itemCls+(active?' active':'')+'" data-stop="1" '+act('setView',[node.code])+'><span>'+node.label+'</span>'+(level>1?'':ICONS.chevronRight)+'</div>';
}

function layout(body){
  const uAccountForMenu = getUserRecord(state.user.username);
  const belumGantiPassword = uAccountForMenu && uAccountForMenu.mustChangePassword;
  function filterMenuForRole(node){
    if(belumGantiPassword) return node.code==='dashboard' ? node : null;
    if(node.superadminOnly && state.user.role!=='superadmin') return null;
    if(state.user.role==='admin_sr' && ADMIN_MENU_TOGGLE_LABELS.hasOwnProperty(node.code)){
      if(currentAdminMenuAccess()[node.code] !== true) return null;
    }
    if(node.children){
      const filteredChildren = node.children.map(filterMenuForRole).filter(Boolean);
      if(filteredChildren.length===0 && !(node.placeholders && node.placeholders.length)) return null;
      return Object.assign({}, node, {children: filteredChildren});
    }
    return node;
  }
  const menuHtml = MENUS.map(filterMenuForRole).filter(Boolean).map(function(m){ return renderMenuNode(m, 1); }).join('');


  const userLabel = state.user.role==='superadmin' ? 'Super Admin Dinas' : 'Admin '+subRayons.find(function(s){return s.id===state.user.sub_rayon_id;}).nama_sub_rayon;

    passwordNoticeHtml = '<div class="alert alert-warning py-2 px-3 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2" style="font-size:13.5px;">'

function breakdownCardHtml(title, counts){

  return '<div class="col-md-6"><div class="card h-100"><div class="card-body">'
    + '<div class="fw-bold mb-2 small">'+esc(title)+'</div>'

function sekolahLabelForInputBy(username){
  const acc = adminAccounts.find(function(a){return a.username===username;});
  if(acc && acc.npsn){
    const sk = sekolahList.find(function(s){return s.npsn===acc.npsn;});
    if(sk) return sk.nama_sekolah;
  }
  return username || '(Tidak diketahui)';
}

const BULAN_LABEL = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function bospMonthlyTable(entries){
  const bySekolah = {};
  entries.forEach(function(e){
    const label = sekolahLabelForInputBy(e.input_by);
    const bulan = e.tanggal ? (parseInt(e.tanggal.slice(5,7),10)-1) : 0;
    if(!bySekolah[label]) bySekolah[label] = Array(12).fill(0);
    bySekolah[label][bulan] += e.jumlah || 0;
  });
  const sekolahKeys = Object.keys(bySekolah);
  if(sekolahKeys.length===0) return '<div class="text-muted small py-2">Belum ada data.</div>';
  return '<div class="table-responsive"><table class="table table-sm table-bordered align-middle mb-0" style="font-size:11.5px;">'
    + '<thead><tr><th>Sekolah</th>'+BULAN_LABEL.map(function(b){return '<th class="text-end">'+b+'</th>';}).join('')+'<th class="text-end">Total</th></tr></thead><tbody>'
    + sekolahKeys.map(function(sk){
        const row = bySekolah[sk];
        const tot = row.reduce(function(a,b){return a+b;},0);
        return '<tr><td>'+esc(sk)+'</td>'+row.map(function(v){return '<td class="text-end">'+(v?rupiah(v):'-')+'</td>';}).join('')+'<td class="text-end fw-bold">'+rupiah(tot)+'</td></tr>';
      }).join('')
    + '</tbody></table></div>';
}

function bospTriwulanTable(entries){
  const bySekolah = {};
  entries.forEach(function(e){
    const label = sekolahLabelForInputBy(e.input_by);
    const tw = e.triwulan || 1;
    if(!bySekolah[label]) bySekolah[label] = [0,0,0,0];
    bySekolah[label][tw-1] += e.jumlah || 0;
  });
  const sekolahKeys = Object.keys(bySekolah);
  if(sekolahKeys.length===0) return '<div class="text-muted small py-2">Belum ada data.</div>';
  return '<div class="table-responsive"><table class="table table-sm table-bordered align-middle mb-0" style="font-size:12px;">'
    + '<thead><tr><th>Sekolah</th><th class="text-end">Triwulan 1</th><th class="text-end">Triwulan 2</th><th class="text-end">Triwulan 3</th><th class="text-end">Triwulan 4</th><th class="text-end">Total</th></tr></thead><tbody>'
    + sekolahKeys.map(function(sk){
        const row = bySekolah[sk];
        const tot = row.reduce(function(a,b){return a+b;},0);
        return '<tr><td>'+esc(sk)+'</td>'+row.map(function(v){return '<td class="text-end">'+(v?rupiah(v):'-')+'</td>';}).join('')+'<td class="text-end fw-bold">'+rupiah(tot)+'</td></tr>';
      }).join('')
    + '</tbody></table></div>';
}

async function exportDataSekolahExcel(){
  if(typeof ExcelJS==='undefined'){ showToast('Library Excel belum selesai dimuat. Tunggu beberapa detik lalu coba lagi.'); return; }
  const list = scopedSekolah().slice().sort(function(a,b){return a.nama_sekolah.localeCompare(b.nama_sekolah);});
  const wb = new ExcelJS.Workbook();
  const sheet = wb.addWorksheet('Data Sekolah');
  applyPageSetupBosp(sheet);
  const headers = ['NPSN','Nama Sekolah','Status','Sub Rayon','Kecamatan','Alamat Sekolah','Nama Pengawas Pembina','NIP Pengawas Pembina','Nama Kepala Sekolah','NIP Kepala Sekolah','Nama Pemerintah Daerah','Website Sekolah','Email Sekolah'];
  sheet.columns = headers.map(function(){ return {width:20}; });
  sheet.addRow(headers).eachCell(function(c){ styleHeaderCell(c); });
  list.forEach(function(sk){
    const srSekolah = subRayons.find(function(sr){return sr.id===sk.sub_rayon_id;});
    const row = sheet.addRow([sk.npsn, sk.nama_sekolah, sk.status_sekolah||'', srSekolah?srSekolah.nama_sub_rayon:'', sk.kecamatan||'', sk.alamat_sekolah||'', sk.nama_pengawas_pembina||'', sk.nip_pengawas_pembina||'', sk.nama_kepala_sekolah||'', sk.nip_kepala_sekolah||'', sk.nama_pemda||'', sk.website_sekolah||'', sk.email_sekolah||'']);
    row.eachCell({includeEmpty:true}, function(c){ c.border = THIN_BORDER; c.alignment = {vertical:'middle', wrapText:true}; });
  });

  // --- Sheet referensi tersembunyi + daftar untuk dropdown Sub Rayon & Kecamatan ---
  // Kecamatan sengaja dibuat 1 daftar LENGKAP (bukan bertingkat per Sub Rayon) supaya dropdown-nya
  // pasti muncul & berfungsi di semua aplikasi spreadsheet (Excel versi apapun, LibreOffice, WPS Office) --
  // pendekatan sebelumnya (dropdown bertingkat pakai rumus INDIRECT) berisiko tidak didukung penuh
  // tergantung aplikasi/pengaturan yang dipakai pengguna.
  const refSheet = wb.addWorksheet('RefData'); refSheet.state = 'veryHidden';
  refSheet.getColumn(1).values = ['SubRayon'].concat(SUB_RAYON_OPTIONS);
  refSheet.getColumn(2).values = ['Kecamatan'].concat(KECAMATAN_OPTIONS);
  wb.definedNames.add('RefData!$A$2:$A$'+(SUB_RAYON_OPTIONS.length+1), 'DaftarSubRayon');
  wb.definedNames.add('RefData!$B$2:$B$'+(KECAMATAN_OPTIONS.length+1), 'DaftarKecamatan');

  for(let r=2; r<=list.length+1; r++){
    sheet.getCell('D'+r).dataValidation = { type:'list', allowBlank:true, formulae:['=DaftarSubRayon'], showErrorMessage:true, errorTitle:'Pilihan Tidak Valid', error:'Pilih Sub Rayon dari daftar.' };
    sheet.getCell('E'+r).dataValidation = { type:'list', allowBlank:true, formulae:['=DaftarKecamatan'], showErrorMessage:true, errorTitle:'Pilihan Tidak Valid', error:'Pilih Kecamatan dari daftar.' };
  }

  downloadWorkbook(wb, 'Data_Sekolah_'+namaSubRayonUser().replace(/\s+/g,'_')+'.xlsx');
}
function validateDataSekolahRows(sheet){
  const errors = [];
  for(let r=2; r<=sheet.rowCount; r++){
    const row = sheet.getRow(r);
    const npsn = cellText(row,1).trim();
    if(!npsn) continue;
    if(!/^[0-9]{8}$/.test(npsn)){ errors.push('Baris '+r+': NPSN harus 8 digit angka.'); }
    if(!cellText(row,2).trim()){ errors.push('Baris '+r+': Nama Sekolah belum diisi.'); }
    const status = cellText(row,3).trim();
    if(status && ['Negeri','Swasta'].indexOf(status)===-1){ errors.push('Baris '+r+': Status harus "Negeri" atau "Swasta".'); }
    const subRayonTxt = cellText(row,4).trim();
    if(subRayonTxt && SUB_RAYON_OPTIONS.indexOf(subRayonTxt)===-1){ errors.push('Baris '+r+': Sub Rayon "'+subRayonTxt+'" tidak dikenali.'); }
    const kecamatanTxt = cellText(row,5).trim();
    if(subRayonTxt && kecamatanTxt){
      const opsiKec = kecamatanUntukSubRayon(subRayonTxt);

    }
  }
  return errors;
}
function importDataSekolahExcel(sheet){

    const data = {

    };

  }
  showToast(added+' sekolah baru ditambahkan, '+updated+' sekolah diperbarui (ada perbedaan), '+unchanged+' sekolah tidak berubah (data sama).');

}

function validateDataOperatorRows(sheet){

    const row = sheet.getRow(r);

    const nip = cellText(row,2).trim();
    const jabatan = cellText(row,5).trim();
    const boleStrip = ['Operator Dapodik','Bendahara/Admin BOSP','Admin OP Aset'].indexOf(jabatan)>-1;
    if(nip!=='-' && !/^[0-9]{18}$/.test(nip)){ errors.push('Baris '+r+': NIP harus 18 digit angka, atau "-" untuk Non ASN.'); }

const PAPER_SIZES = { A4: '210mm 297mm', F4: '215mm 330mm', Legal: '215.9mm 355.6mm' };

function marginCss(){
  const t = parseFloat(state.marginTop)||0, r = parseFloat(state.marginRight)||0, b = parseFloat(state.marginBottom)||0, l = parseFloat(state.marginLeft)||0;
  return t+'cm '+r+'cm '+b+'cm '+l+'cm';
}

function updatePaperSizeStyle(){
  const el = document.getElementById('printPageSizeStyle');
  if(!el) return;
  let size;
  if(state.customPaperWidth && state.customPaperHeight){
    size = state.customPaperWidth+'mm '+state.customPaperHeight+'mm';
  } else {
    size = PAPER_SIZES[state.paperSize] || PAPER_SIZES.A4;
  }
  if(state.suratOrientation==='landscape') size += ' landscape';
  el.textContent = '@page { size: '+size+'; margin: '+marginCss()+'; }';
}

function insertTableSurat(){
  const rows = parseInt(prompt('Jumlah baris tabel?', '3'), 10) || 3;
  const cols = parseInt(prompt('Jumlah kolom tabel?', '3'), 10) || 3;
  let tbl = '<table style="border-collapse:collapse;width:100%;margin:8px 0;">';
  for(let r=0; r<rows; r++){
    tbl += '<tr>';
    for(let c=0; c<cols; c++){ tbl += '<td style="border:1px solid #333;padding:6px;min-width:40px;">&nbsp;</td>'; }
    tbl += '</tr>';
  }
  tbl += '</table>';
  document.execCommand('insertHTML', false, tbl);
}

  const url = prompt('Masukkan alamat tautan (URL):', 'https://');
  if(!url) return;
  document.execCommand('createLink', false, url);
}

function insertTextBoxSurat(){
  document.execCommand('insertHTML', false, '<div style="border:1px solid #333;padding:8px;margin:8px 0;display:inline-block;min-width:150px;" contenteditable="true">Kotak Teks</div>');

function insertShapeSurat(shape){
  let html;
  if(shape==='rect') html = '<div style="width:100px;height:60px;border:2px solid #333;display:inline-block;margin:4px;vertical-align:middle;"></div>';
  else if(shape==='circle') html = '<div style="width:60px;height:60px;border:2px solid #333;border-radius:50%;display:inline-block;margin:4px;vertical-align:middle;"></div>';
  else html = '<hr style="border:none;border-top:2px solid #333;margin:10px 0;">';
  document.execCommand('insertHTML', false, html);
}

function insertImageSurat(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function(){
    const file = inp.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){ document.execCommand('insertImage', false, ev.target.result); };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function nomorSuratKey(jenis, npsn, tw){ return jenis+'_'+npsn+'_tw'+tw; }

async function simpanNomorSurat(jenis, npsn, tw){
  const nomor = val('nomorSuratInput').trim();
  if(!nomor){ showToast('Nomor surat belum diisi.'); return; }
  state.nomorSuratMap[nomorSuratKey(jenis, npsn, tw)] = nomor;
  try { await api.put('/format-surat', {tahun_anggaran: state.tahunAnggaran, nomor_surat_map: state.nomorSuratMap}); }
  catch(err){ tampilkanErrorApi(err); return; }
  showToast('Nomor surat berhasil disimpan dan diterapkan ke surat.');
  render();
}

async function toggleEditSurat(key, containerId){
  if(state.editingSuratKey === key){
    const el = document.getElementById(containerId);
    if(el){ state.editedSuratMap[key] = el.innerHTML; }
    state.editingSuratKey = null;
    try { await api.put('/format-surat', {tahun_anggaran: state.tahunAnggaran, edited_surat_map: state.editedSuratMap}); }
    catch(err){ tampilkanErrorApi(err); return; }
    showToast('Perubahan tampilan surat berhasil disimpan.');
    render();
  } else {
    state.editingSuratKey = key;
    render();
    setTimeout(function(){
      const el = document.getElementById(containerId);
      if(el) el.focus();
    }, 0);
  }
}

function resetSurat(key){
  delete state.editedSuratMap[key];
  if(state.editingSuratKey === key) state.editingSuratKey = null;
  showToast('Surat dikembalikan ke format asli (bawaan sistem).');
  render();
}

  baris.push('<div style="font-size:1.714em;font-weight:bold;text-transform:uppercase;line-height:1.25;">'+esc(sekolah.nama_sekolah)+'</div>');

  if(sekolah.email_sekolah){ baris.push('<div style="font-size:0.571em;">'+esc(sekolah.email_sekolah)+'</div>'); }

    + '<div style="flex:1;text-align:center;">'+baris.join('')+'</div>'
    + '<div style="width:70px;height:70px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;">'+(sekolah.logo_sekolah?'<img src="'+sekolah.logo_sekolah+'" style="width:70px;height:70px;object-fit:contain;">':'<div style="width:70px;height:70px;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:9px;color:#999;">Logo Sekolah</div>')+'</div>'
    + '</div>'
    + '<div style="border-bottom:4px solid #111;margin-bottom:28px;"></div>';
}

function autoFitPages(){
  document.querySelectorAll('.auto-fit-page').forEach(function(el){
    const maxHeight = parseInt(el.dataset.maxHeight || '1050', 10);
    let fontSize = 14;
    el.style.fontSize = fontSize+'px';
    let guard = 0;
    while(el.scrollHeight > maxHeight && fontSize > 8.5 && guard < 30){
      fontSize -= 0.5;
      el.style.fontSize = fontSize+'px';
      guard++;
    }
  });
}

  const scoped = trashList.filter(function(t){ return state.user.role==='superadmin' || t.sub_rayon_id===state.user.sub_rayon_id; });
  let list = scoped;
  if(state.filterJenisTrash) list = list.filter(function(t){return t.sourceType===state.filterJenisTrash;});
  state.selectedTrashIds = checked ? list.map(function(t){return t.id;}) : [];
  render();
}
function toggleTrashSelectOne(idStr, checked){
  const id = parseInt(idStr, 10);
  state.selectedTrashIds = state.selectedTrashIds || [];
  if(checked){ if(state.selectedTrashIds.indexOf(id)===-1) state.selectedTrashIds.push(id); }
  else { state.selectedTrashIds = state.selectedTrashIds.filter(function(x){return x!==id;}); }
  render();
}
function hapusSementaraSemuaTrash(){
  const ids = state.selectedTrashIds || [];
  if(ids.length===0){ showToast('Pilih minimal satu data terlebih dahulu.'); return; }
  ids.forEach(function(id){
    const item = trashList.find(function(t){return t.id===id;});
    if(item) item.permanent = false;
  });
  showToast(ids.length+' data ditandai sebagai Hapus Sementara (masih bisa dipulihkan).');
  state.selectedTrashIds = [];
  render();
}
async function hapusPermanenSemuaTrash(){
  const ids = state.selectedTrashIds || [];
  if(ids.length===0){ showToast('Pilih minimal satu data terlebih dahulu.'); return; }
  try {
    await api.post('/trash/hapus-permanen-massal', {ids: ids});
  } catch(err){ tampilkanErrorApi(err); return; }
  trashList = trashList.filter(function(t){ return ids.indexOf(t.id)===-1; });
  showToast(ids.length+' data dihapus permanen dan tidak bisa dipulihkan lagi.');
  state.selectedTrashIds = [];
  render();
}
function viewHapusData(){
  const scoped = trashList.filter(function(t){
    return state.user.role==='superadmin' || t.sub_rayon_id===state.user.sub_rayon_id;
  });
  let list = scoped;
  if(state.filterJenisTrash) list = list.filter(function(t){return t.sourceType===state.filterJenisTrash;});
  list = list.slice().sort(function(a,b){return b.deletedAt.localeCompare(a.deletedAt);});
  const selected = state.selectedTrashIds || [];
  const allSelected = list.length>0 && list.every(function(t){return selected.indexOf(t.id)>-1;});

  let html = '<p class="text-muted small" style="max-width:750px;">'
    + 'Semua data yang dihapus dari menu manapun akan muncul di sini terlebih dahulu (<strong>Hapus Sementara</strong>) dan masih bisa dipulihkan. '
    + 'Data akan otomatis tidak bisa dipulihkan lagi (<strong>Hapus Permanen</strong>) setelah tanggal 31 Desember tahun berikutnya — mulai 1 Januari setelah itu, seluruh data yang tersisa berstatus Aktif.'
    + '</p>';

  html += '<div class="mb-3" style="max-width:320px;">'
    + '<label class="form-label small text-muted mb-1">Filter berdasarkan Jenis Data</label>'
    + '<select class="form-select form-select-sm" data-on-change="filter:filterJenisTrash">'
    + '<option value="">-- Semua Jenis --</option>'
    + Object.keys(TRASH_TYPE_LABELS).map(function(k){ return '<option value="'+k+'"'+(state.filterJenisTrash===k?' selected':'')+'>'+TRASH_TYPE_LABELS[k]+'</option>'; }).join('')
    + '</select></div>';

  html += '<div class="mb-3 d-flex align-items-center gap-2 flex-wrap">'
    + '<button type="button" class="btn btn-outline-warning btn-sm" '+act('hapusSementaraSemuaTrash')+'>'+ICONS.check+'Hapus Sementara Semua (Terpilih)</button>'
    + '<button type="button" class="btn btn-outline-danger btn-sm" '+act('hapusPermanenSemuaTrash')+'>'+ICONS.trash+'Hapus Permanen Semua (Terpilih)</button>'
    + '<span class="text-muted small">'+selected.length+' data terpilih</span>'
    + '</div>';

  const zoomTrash = state.zoomHapusData || 100;
  html += '<div class="d-flex align-items-center gap-2 mb-2 flex-wrap">'
    + '<button class="btn btn-outline-success btn-sm" '+act('unduhHapusDataExcel')+'>'+ICONS.download+'Unduh Excel</button>'
    + '<button class="btn btn-outline-danger btn-sm" '+act('unduhHapusDataPdf')+'>'+ICONS.download+'Unduh PDF</button>'
    + '<button type="button" class="btn btn-outline-secondary btn-sm" '+act('genericZoomOut',['zoomHapusData'])+'><img src="'+ZOOM_OUT_ICON_URL+'" style="width:18px;height:18px;vertical-align:-3px;margin-right:4px;" alt="Zoom Out"/> Zoom Out</button>'
    + '<span class="text-muted small">'+zoomTrash+'%</span>'
    + '<button type="button" class="btn btn-outline-secondary btn-sm" '+act('genericZoomIn',['zoomHapusData'])+'><img src="'+ZOOM_IN_ICON_URL+'" style="width:18px;height:18px;vertical-align:-3px;margin-right:4px;" alt="Zoom In"/> Zoom In</button>'
    + '<button type="button" class="btn btn-outline-secondary btn-sm" '+act('genericZoomReset',['zoomHapusData'])+'><img src="'+RESET_ICON_URL+'" style="width:18px;height:18px;vertical-align:-3px;margin-right:4px;" alt="Reset"/>Reset</button>'
    + '</div>';

  html += '<div class="card"><div class="card-body"><div class="table-responsive table-scroll" style="zoom:'+zoomTrash+'%;"><table class="table table-hover align-middle">'
    + '<thead><tr><th style="width:32px;"><input type="checkbox" data-change-action="toggleTrashSelectAll"'+(allSelected?' checked':'')+'/></th><th>Nama/Data</th><th>Jenis</th><th>Alasan</th><th>Tanggal Dihapus</th><th>Status</th><th>Batas Waktu Pulih</th><th class="text-center">Aksi</th></tr></thead><tbody>';

  html += list.length===0 ? '<tr><td colspan="8" class="text-center text-muted py-4">Belum ada data yang dihapus.</td></tr>' : list.map(function(t){
    const cutoff = permanentCutoffDate(t.deletedAt);
    const statusBadge = t.permanent
      ? '<span class="badge bg-danger">Hapus Permanen</span>'
      : '<span class="badge bg-warning text-dark">Hapus Sementara</span>';
    const isChecked = selected.indexOf(t.id)>-1;
    return '<tr><td><input type="checkbox" data-change-action="toggleTrashSelectOne" data-change-arg="'+t.id+'"'+(isChecked?' checked':'')+'/></td><td>'+esc(t.label)+'</td><td>'+TRASH_TYPE_LABELS[t.sourceType]+'</td><td>'+(t.reason?esc(t.reason):'<span class="text-muted">-</span>')+'</td>'
      + '<td>'+fmtTgl(t.deletedAt)+'</td><td>'+statusBadge+'</td><td>'+(t.permanent?'<span class="text-muted">-</span>':fmtTgl(cutoff))+'</td>'
      + '<td class="text-center">'
      + (!t.permanent ? '<button class="btn btn-sm btn-outline-success" '+act('restoreFromTrash',[t.id])+' title="Pulihkan">'+ICONS.check+'</button> ' : '')
      + '<button class="btn btn-sm btn-outline-danger" '+act('permanentDeleteTrash',[t.id])+' title="Hapus Permanen">'+ICONS.trash+'</button>'
      + '</td></tr>';
  }).join('');

  html += '</tbody></table></div></div></div>';
  return html;
}

function simpanRegistrasi(){
  const npsn = val('regNpsn').trim(), namaSekolah = val('regNamaSekolah').trim(), namaOperator = val('regNamaOperator').trim();
  const jabatan = val('regJabatan'), password = val('regPassword');
  const namaAdminBosp = val('regNamaAdminBosp').trim();
  let username = val('regUsername').trim();
  if(!npsn || !namaSekolah || !namaOperator || !jabatan || !password){ showToast('Semua field wajib diisi.'); return; }
  if(jabatan==='Bendahara/Admin BOSP' && !namaAdminBosp){ showToast('Nama Admin BOSP wajib diisi untuk Jabatan Bendahara/Admin BOSP.'); return; }
  if(!/^[0-9]{8}$/.test(npsn)){ showToast('NPSN harus 8 digit angka.'); return; }
  if(password.length < 6){ showToast('Password minimal 6 karakter/angka.'); return; }
  if(!username){ showToast('Isi NPSN terlebih dahulu supaya Username otomatis terisi.'); return; }

  // Satu Jabatan hanya untuk satu Admin per sekolah (NPSN). Kalau sudah ada, tolak dan arahkan ke Superadmin.
  const jabatanSudahAda = adminAccounts.some(function(a){ return a.npsn===npsn && a.jabatan===jabatan; });
  if(jabatanSudahAda){
    showToast('Jabatan "'+jabatan+'" untuk sekolah dengan NPSN '+npsn+' sudah terdaftar oleh Admin lain. Hubungi Superadmin untuk reset atau perubahan data.');
    return;
  }
  const usernameDipakai = superadminAccounts.some(function(a){return a.username===username;}) || adminAccounts.some(function(a){return a.username===username;});
  if(usernameDipakai){ showToast('Username "'+username+'" sudah dipakai akun lain, silakan ulangi isi NPSN.'); return; }

  const subRayonId = subRayons[0] ? subRayons[0].id : 1;
  const sekolahSudahAda = sekolahList.find(function(s){return s.npsn===npsn;});

  if(!sekolahSudahAda){
    sekolahList.push({
      npsn: npsn, nama_sekolah: namaSekolah, alamat_sekolah: '', nama_pengawas_pembina: '', nip_pengawas_pembina: '',
      nama_kepala_sekolah: '', nip_kepala_sekolah: '', nama_pemda: '', website_sekolah: '', email_sekolah: '',
      logo_sekolah: null, logo_pemda: null, sub_rayon_id: subRayonId, input_by: username,
    });
  }
  operatorList.push({
    id: nextIdOperator++, nama_ops: namaOperator, nip: '-', tempat_lahir: '', tanggal_lahir: '', jabatan: jabatan,
    nama_admin_bosp: jabatan==='Bendahara/Admin BOSP' ? namaAdminBosp : '',
    unit_kerja: npsn, alamat_rumah: '', no_whatsapp: '', foto_ops: null, sk_ops_bendahara: null, sub_rayon_id: subRayonId, input_by: username,
  });
  adminAccounts.push({
    id: nextAdminAccountId++, nama: namaOperator, level_admin: 'Admin Sekolah', jabatan: jabatan, npsn: npsn,
    username: username, password: password, mustChangePassword: true, sub_rayon_id: subRayonId,
  });

  state.showRegistrasi = false;
  showToast('Registrasi berhasil! Sekolah "'+namaSekolah+'", Operator "'+namaOperator+'" ('+jabatan+'), dan akun Admin ("'+username+'") sudah tersimpan.'+(sekolahSudahAda?' (Sekolah ini sudah terdaftar sebelumnya, hanya Operator & Admin baru yang ditambahkan.)':' Lengkapi data sekolah/operator lewat menu Data Master.'));
  render();
}

function hitungSaldoBerjalan(entries, saldoAwal){
  const sorted = entries.slice().sort(function(a,b){ return (a.tanggal||'').localeCompare(b.tanggal||'') || (a.id-b.id); });
  let running = saldoAwal;
  return sorted.map(function(e){
    running = running + (e.penerimaan||0) - (e.pengeluaran||0);
    return Object.assign({}, e, {saldo: running});
  });
}

async function fmtBkuSaldoAwal(key){
  const el = document.getElementById('bkuSaldoAwalInput');
  const angka = parseInt(el.value.replace(/[^0-9]/g,''),10) || 0;
  bkuSaldoAwal[key] = angka;
  const tw = parseInt(key.split('_')[0],10);
  const kas = bkuSaldoKas[key] || {awalTunai:0, awalBank:0};
  try {
    await api.put('/bku/saldo-awal', {triwulan: tw, tahun_anggaran: state.tahunAnggaran, input_by: state.user.username, saldo_awal: angka, saldo_tunai_awal: kas.awalTunai||0, saldo_bank_awal: kas.awalBank||0});
  } catch(err){ tampilkanErrorApi(err); return; }
  render();
}

async function fmtBkuSaldoKas(key, field, inputId){
  const el = document.getElementById(inputId);
  const angka = parseInt(el.value.replace(/[^0-9]/g,''),10) || 0;
  if(!bkuSaldoKas[key]) bkuSaldoKas[key] = {awalTunai:0, awalBank:0, akhirTunai:0, akhirBank:0};
  bkuSaldoKas[key][field] = angka;
  if(field==='awalTunai' || field==='awalBank'){
    const tw = parseInt(key.split('_')[0],10);
    try {
      await api.put('/bku/saldo-awal', {triwulan: tw, tahun_anggaran: state.tahunAnggaran, input_by: state.user.username, saldo_awal: bkuSaldoAwal[key]||0, saldo_tunai_awal: bkuSaldoKas[key].awalTunai||0, saldo_bank_awal: bkuSaldoKas[key].awalBank||0});
    } catch(err){ tampilkanErrorApi(err); return; }
  }
  render();
}

async function saveBkuClick(tw){
  const tanggal = val('bkuTanggal');
  const kodeKegiatan = val('bkuKodeKegiatan').trim();
  const kodeRekening = val('bkuKodeRekening').trim();
  const noBukti = val('bkuNoBukti').trim();
  const uraian = val('bkuUraian').trim();
  const penerimaan = parseInt(val('bkuPenerimaan').replace(/[^0-9]/g,''),10) || 0;
  const pengeluaran = parseInt(val('bkuPengeluaran').replace(/[^0-9]/g,''),10) || 0;
  if(!tanggal || !noBukti || !uraian){ showToast('Tanggal, No Bukti, dan Uraian wajib diisi.'); return; }
  if(!penerimaan && !pengeluaran){ showToast('Isi salah satu: Penerimaan/Kredit atau Pengeluaran/Debit.'); return; }
  if(pengeluaran>0 && (!kodeKegiatan || !kodeRekening)){ showToast('Kode Kegiatan dan Kode Rekening wajib diisi untuk transaksi Pengeluaran/Debit.'); return; }
  const isNew = state.editingBosp === 'new';
  try {
    if(isNew){
      const created = await api.post('/bku', {triwulan: tw, tahun_anggaran: state.tahunAnggaran, tanggal: tanggal, kode_kegiatan: kodeKegiatan, kode_rekening: kodeRekening, no_bukti: noBukti, uraian: uraian, penerimaan: penerimaan, pengeluaran: pengeluaran, sub_rayon_id: subRayonIdWajib(), input_by: state.user.username});
      bkuEntries.push(created);
      showToast('Transaksi BKU berhasil ditambahkan.');
    } else {
      const rec = bkuEntries.find(function(x){return x.id===state.editingBosp;});
      await api.patch('/bku/'+rec.id, {tanggal:tanggal, kode_kegiatan:kodeKegiatan, kode_rekening:kodeRekening, no_bukti:noBukti, uraian:uraian, penerimaan:penerimaan, pengeluaran:pengeluaran});
      Object.assign(rec, {tanggal:tanggal, kode_kegiatan:kodeKegiatan, kode_rekening:kodeRekening, no_bukti:noBukti, uraian:uraian, penerimaan:penerimaan, pengeluaran:pengeluaran});
      showToast('Transaksi BKU berhasil diperbarui.');
    }
  } catch(err){ tampilkanErrorApi(err); return; }
  state.editingBosp = null;
  render();
}

async function hapusBku(id){
  const idx = bkuEntries.findIndex(function(x){return x.id===id;});
  if(idx===-1) return;
  try { await api.del('/bku/'+id); }
  catch(err){ tampilkanErrorApi(err); return; }
  bkuEntries.splice(idx,1);
  showToast('Transaksi BKU berhasil dihapus.');
  render();
}

async function simpanBospSimpleSel(key, rawValue){
  const parts = key.split(':');
  const id = parseInt(parts[0],10), field = parts[1];
  const rec = bospEntries.find(function(x){return x.id===id;});
  if(!rec) return;
  const payload = {};
  if(field==='npsn'){
    rec.npsn = rawValue.trim();
    const src = penerimaanBospList.find(function(p){return p.npsn===rec.npsn;});
    if(src){ rec.nama_sekolah = src.nama_sekolah; }
    payload.npsn = rec.npsn;
  } else if(field==='volume'){
    rec.volume = parseFloat(String(rawValue).replace(/[^0-9.]/g,'')) || 0;
    payload.volume = rec.volume;
  } else if(field==='harga_satuan'){
    rec.harga_satuan = parseFloat(String(rawValue).replace(/[^0-9.]/g,'')) || 0;
    payload.harga_satuan = rec.harga_satuan;
  } else if(field==='tanggal'){
    rec.tanggal = rawValue;
    payload.tanggal = rawValue;
  } else {
    rec[field] = rawValue.trim();
    payload[field] = rec[field];
  }
  hitungSimpleKategoriRow(rec);
  try {
    const updated = await api.patch('/bosp-entries/'+id, payload);
    rec.jumlah = parseFloat(updated.jumlah)||0;
  } catch(err){ tampilkanErrorApi(err); return; }
  render();
}
function tempelDataBospInline(kode, tw, startIdStr, field, lines){
  const startId = parseInt(startIdStr, 10);
  const list = lpjBospFilterList(scopedBosp(kode, tw).slice().sort(function(a,b){return (a.nama_sekolah||'').localeCompare(b.nama_sekolah||'') || (a.tanggal||'').localeCompare(b.tanggal||'');}));
  let startIdx = list.findIndex(function(x){ return x.id===startId; });
  if(startIdx===-1) startIdx = 0;
  const promiseChain = lines.reduce(function(chain, val, i){
    return chain.then(async function(){
      const idx = startIdx + i;
      let rec = list[idx];
      if(!rec){
        const created = await api.post('/bosp-entries', {kategori: kode, triwulan: tw, tahun_anggaran: state.tahunAnggaran, tanggal: new Date().toISOString().slice(0,10), sub_rayon_id: subRayonIdWajib(), input_by: state.user.username});
        rec = Object.assign({nama_sekolah:''}, created);
        bospEntries.push(rec);
        list.push(rec);
      }
      const payload = {};
      if(field==='npsn'){
        rec.npsn = val.trim();
        const src = penerimaanBospList.find(function(p){return p.npsn===rec.npsn;});
        if(src){ rec.nama_sekolah = src.nama_sekolah; }
        payload.npsn = rec.npsn;
      } else if(field==='volume'){
        rec.volume = parseFloat(String(val).replace(/[^0-9.]/g,'')) || 0;
        payload.volume = rec.volume;
      } else if(field==='harga_satuan'){
        rec.harga_satuan = parseFloat(String(val).replace(/[^0-9.]/g,'')) || 0;
        payload.harga_satuan = rec.harga_satuan;
      } else if(field==='tanggal'){
        rec.tanggal = val.trim();
        payload.tanggal = rec.tanggal;
      } else {
        rec[field] = val.trim();
        payload[field] = rec[field];
      }
      hitungSimpleKategoriRow(rec);
      try {
        const updated = await api.patch('/bosp-entries/'+rec.id, payload);
        rec.jumlah = parseFloat(updated.jumlah)||0;
      } catch(err){ tampilkanErrorApi(err); }
    });
  }, Promise.resolve());
  promiseChain.then(function(){
    showToast(lines.length+' baris berhasil ditempel ke kolom.');
    render();
  });
}

function tempelDataOpsInline(source, startIdStr, field, lines){

  else if(source==='operator') tempelDataOperatorInline(startIdStr, field, lines);

function simpanOpsInlineSel(key, rawValue){

async function tambahBarisSertifikasi(){
  try {
    const created = await api.post('/sertifikasi', {sub_rayon_id: subRayonIdWajib(), input_by: state.user.username});

async function simpanSertifikasiInlineSel(id, field, rawValue){
  const rec = sertifikasiList.find(function(x){return x.id===id;});
  if(!rec) return;
  const val2 = rawValue.trim ? rawValue.trim() : rawValue;
  const payload = {};
  if(field==='ptk_nrg'){
    rec.ptk_nrg = val2;
    const ptk = ptkList.find(function(p){return p.nrg===rec.ptk_nrg;});
    rec.nama_ptk = ptk ? ptk.nama_ptk : '';
    payload.ptk_nrg = val2;
  } else {
    rec[field] = val2;
    payload[field] = val2;
  }
  try { await api.patch('/sertifikasi/'+id, payload); }
  catch(err){ tampilkanErrorApi(err); return; }
  render();
}
function tempelDataSertifikasiInline(startIdStr, field, lines){
  const startId = parseInt(startIdStr, 10);
  const list = scopedSertifikasi();
  let startIdx = list.findIndex(function(x){ return x.id===startId; });
  if(startIdx===-1) startIdx = 0;
  const promiseChain = lines.reduce(function(chain, val, i){
    return chain.then(async function(){
      const idx = startIdx + i;
      let rec = list[idx];
      if(!rec){
        const created = await api.post('/sertifikasi', {sub_rayon_id: subRayonIdWajib(), input_by: state.user.username});
        rec = Object.assign({nama_ptk:''}, created);
        sertifikasiList.push(rec);
        list.push(rec);
      }
      const v = val.trim();
      const payload = {};
      if(field==='ptk_nrg'){
        rec.ptk_nrg = v;
        const ptk = ptkList.find(function(p){return p.nrg===rec.ptk_nrg;});
        rec.nama_ptk = ptk ? ptk.nama_ptk : '';
        payload.ptk_nrg = v;
      } else {
        rec[field] = v;
        payload[field] = v;
      }
      try { await api.patch('/sertifikasi/'+rec.id, payload); }
      catch(err){ tampilkanErrorApi(err); }
    });
  }, Promise.resolve());
  promiseChain.then(function(){
    showToast(lines.length+' baris berhasil ditempel ke kolom.');
    render();
  });
}

function findPtkByRowId(id){ return ptkList.find(function(p){ return ptkRowId(p)===id; }); }
// Baris PTK baru DIBUAT di database begitu NRG & Nama PTK terisi (2 field wajib minimum di skema).
async function simpanFieldPtkKeServer(rec, fieldBaru, nrgBaru){
  if(rec._belumTersimpan){
    if(fieldBaru==='nrg') rec.nrg = nrgBaru;
    if(!rec.nrg || !rec.nama_ptk) return;
    const payload = Object.assign({}, rec);
    delete payload._belumTersimpan; delete payload._rowId;
    await api.post('/ptk', payload);
    delete rec._belumTersimpan;
    return;
  }
  await api.patch('/ptk/'+rec.nrg, {[fieldBaru]: rec[fieldBaru]});
}
async function simpanPtkInlineSel(id, field, rawValue){
  const rec = findPtkByRowId(id);
  if(!rec) return;
  let nilaiBaru;
  if(PTK_FIELDS_NUMBER.indexOf(field)>-1 || field==='gaji_pokok') nilaiBaru = parseInt(String(rawValue).replace(/[^0-9]/g,''),10) || 0;
  else nilaiBaru = rawValue.trim ? rawValue.trim() : rawValue;
  try {
    if(field==='nrg'){ await simpanFieldPtkKeServer(rec, 'nrg', nilaiBaru); rec.nrg = nilaiBaru; }
    else { rec[field] = nilaiBaru; await simpanFieldPtkKeServer(rec, field); }
  } catch(err){ tampilkanErrorApi(err); return; }
  render();
}

  const startId = parseInt(startIdStr, 10);

  if(startIdx===-1) startIdx = 0;
  const promiseChain = lines.reduce(function(chain, val, i){
    return chain.then(async function(){
      const idx = startIdx + i;
      let rec = list[idx];
      if(!rec){
        rec = {nrg:'', _belumTersimpan: true, nuptk:'', nik:'', nama_ptk:'', jenis_kelamin:'', tempat_lahir:'', tanggal_lahir:'', nip:'', status_kepegawaian:'', nama_jabatan:'',

// Baris baru sekolah baru DIBUAT di database begitu 4 field wajib (NPSN, Nama, Status, Alamat) lengkap.
async function simpanFieldSekolahKeServer(rec, fieldBaru, npsnBaru){
  if(rec._belumTersimpan){
    if(fieldBaru==='npsn') rec.npsn = npsnBaru;
    if(!rec.npsn || !rec.nama_sekolah || !rec.status_sekolah || !rec.alamat_sekolah) return; // belum cukup lengkap
    const payload = {npsn: rec.npsn, nama_sekolah: rec.nama_sekolah, status_sekolah: rec.status_sekolah, alamat_sekolah: rec.alamat_sekolah,
      sub_rayon_id: rec.sub_rayon_id, input_by: rec.input_by};
    ['kecamatan','nama_pengawas_pembina','nip_pengawas_pembina','nama_kepala_sekolah','nip_kepala_sekolah','nama_pemda','website_sekolah','email_sekolah'].forEach(function(k){
      if(rec[k]) payload[k] = rec[k];
    });
    await api.post('/sekolah', payload);
    delete rec._belumTersimpan;
    return;
  }
  if(fieldBaru==='npsn' && npsnBaru){
    // Sekolah SUDAH tersimpan (punya NPSN lama di database) dan sedang mengubah NPSN-nya --
    // URL harus tetap pakai NPSN LAMA (kunci baris yang mau diubah), body berisi NPSN BARU.
    const npsnLama = rec.npsn;
    await api.patch('/sekolah/'+npsnLama, {npsn: npsnBaru});
    return;
  }
  await api.patch('/sekolah/'+rec.npsn, {[fieldBaru]: rec[fieldBaru]});
}
function isValidEmailFormat(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }
function isValidWebsiteFormat(s){ return /^(https?:\/\/)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}([\/?].*)?$/.test(s); }
function cekDuplikatNip(nipBaru, sourceNpsn, sourceField){
  for(let i=0;i<sekolahList.length;i++){
    const s = sekolahList[i];
    const isSelfPengawas = (s.npsn===sourceNpsn && sourceField==='nip_pengawas_pembina');
    const isSelfKepsek = (s.npsn===sourceNpsn && sourceField==='nip_kepala_sekolah');
    if(!isSelfPengawas && s.nip_pengawas_pembina && s.nip_pengawas_pembina===nipBaru){
      return {nama: s.nama_pengawas_pembina, peran:'NIP Pengawas Pembina', sekolah: s.nama_sekolah};
    }
    if(!isSelfKepsek && s.nip_kepala_sekolah && s.nip_kepala_sekolah===nipBaru){
      return {nama: s.nama_kepala_sekolah, peran:'NIP Kepala Sekolah', sekolah: s.nama_sekolah};
    }
  }
  return null;
}

async function simpanSekolahInlineSel(idStr, field, rawValue){
  const id = parseInt(idStr, 10);
  const rec = findSekolahByRowId(id);
  if(!rec) return;
  const val2 = rawValue.trim ? rawValue.trim() : rawValue;
  if(field==='nip_pengawas_pembina' || field==='nip_kepala_sekolah'){
    if(val2 && val2!=='-' && !/^[0-9]{18}$/.test(val2)){
      state.sekolahValidasiPopup = {judul:'NIP Tidak Valid', pesan:(field==='nip_pengawas_pembina'?'NIP Pengawas Pembina':'NIP Kepala Sekolah')+' harus 18 digit angka. Silakan input ulang.'};
      render();
      return;
    }
    if(val2 && val2!=='-'){
      const dup = cekDuplikatNip(val2, rec.npsn, field);
      if(dup){
        state.sekolahValidasiPopup = {judul:'NIP Sama Dengan Data Lain', pesan:'NIP tersebut sudah dipakai oleh '+dup.nama+' ('+dup.peran+') di sekolah '+dup.sekolah+'. NIP tidak boleh sama, silakan input ulang.'};
        render();
        return;
      }
    }
  }
  if(field==='website_sekolah' && val2 && !isValidWebsiteFormat(val2)){
    state.sekolahValidasiPopup = {judul:'Format Website Tidak Valid', pesan:'Format Website Sekolah tidak sesuai (cth: www.sdncontoh.sch.id). Silakan input ulang.'};
    render();
    return;
  }
  if(field==='email_sekolah' && val2 && !isValidEmailFormat(val2)){
    state.sekolahValidasiPopup = {judul:'Format Email Tidak Valid', pesan:'Format Email Sekolah tidak sesuai (cth: sekolah@gmail.com). Silakan input ulang.'};
    render();
    return;
  }
  try {
    if(field==='npsn'){
      await simpanFieldSekolahKeServer(rec, 'npsn', val2);
      rec.npsn = val2;
    } else {
      rec[field] = val2;
      await simpanFieldSekolahKeServer(rec, field);
    }
  } catch(err){
    // Alih-alih popup yang menghalangi & harus ditutup manual, langsung muat ulang data
    // Sekolah dari server (memperbaiki diri sendiri kalau ada data yang sempat tidak sinkron)
    // dan beri tahu lewat notifikasi singkat saja.
    showToast('Perubahan tidak tersimpan ('+err.message+'). Data sekolah dimuat ulang dari server.');
    try {
      const sekolahTerbaru = await api.get('/sekolah');
      replaceArray(sekolahList, sekolahTerbaru);
    } catch(e2){ /* kalau muat ulang juga gagal, biarkan data lama tetap tampil */ }
    renderPertahankanFokus();
    return;
  }
  renderPertahankanFokus();
}
function tempelDataSekolahInline(startIdStr, field, lines){
  const startId = parseInt(startIdStr, 10);
  const list = listSekolahTertampil();
  let startIdx = list.findIndex(function(x){ return sekolahRowId(x)===startId; });
  if(startIdx===-1) startIdx = 0;
  if(field==='nip_pengawas_pembina' || field==='nip_kepala_sekolah'){
    for(let i=0;i<lines.length;i++){
      const v = lines[i].trim();
      if(v && v!=='-' && !/^[0-9]{18}$/.test(v)){
        state.sekolahValidasiPopup = {judul:'NIP Tidak Valid', pesan:'Salah satu nilai yang di-paste ("'+v+'") bukan 18 digit angka. Perbaiki data di Excel lalu paste ulang.'};
        render();
        return;
      }
    }
  }
  if(field==='website_sekolah'){
    for(let i=0;i<lines.length;i++){
      const v = lines[i].trim();
      if(v && !isValidWebsiteFormat(v)){
        state.sekolahValidasiPopup = {judul:'Format Website Tidak Valid', pesan:'Salah satu nilai yang di-paste ("'+v+'") bukan format website yang valid. Perbaiki data di Excel lalu paste ulang.'};
        render();
        return;
      }
    }
  }
  if(field==='email_sekolah'){
    for(let i=0;i<lines.length;i++){
      const v = lines[i].trim();
      if(v && !isValidEmailFormat(v)){
        state.sekolahValidasiPopup = {judul:'Format Email Tidak Valid', pesan:'Salah satu nilai yang di-paste ("'+v+'") bukan format email yang valid. Perbaiki data di Excel lalu paste ulang.'};
        render();
        return;
      }
    }
  }
  const promiseChain = lines.reduce(function(chain, val, i){
    return chain.then(async function(){
      const idx = startIdx + i;
      let rec = list[idx];
      if(!rec){
        rec = {npsn:'', _belumTersimpan: true, nama_sekolah:'', status_sekolah:'', alamat_sekolah:'', nama_pengawas_pembina:'', nip_pengawas_pembina:'',
          nama_kepala_sekolah:'', nip_kepala_sekolah:'', nama_pemda:'', website_sekolah:'', email_sekolah:'', kecamatan:'', logo_sekolah:null, logo_pemda:null,
          sub_rayon_id: subRayonIdWajib(), input_by: state.user.username};
        sekolahRowId(rec);
        sekolahList.push(rec);
        list.push(rec);
      }
      const v = val.trim();
      try {
        if(field==='npsn'){ await simpanFieldSekolahKeServer(rec, 'npsn', v); rec.npsn = v; }
        else { rec[field] = v; await simpanFieldSekolahKeServer(rec, field); }
      } catch(err){ tampilkanErrorApi(err); }
    });
  }, Promise.resolve());
  promiseChain.then(function(){
    showToast(lines.length+' baris berhasil ditempel ke kolom.');
    render();
  });
}
function urutkanDataSekolah(list){
  return list.slice().sort(function(a,b){
    const statusOrder = {'Negeri':0,'Swasta':1};
    const sa = statusOrder.hasOwnProperty(a.status_sekolah) ? statusOrder[a.status_sekolah] : 2;
    const sb = statusOrder.hasOwnProperty(b.status_sekolah) ? statusOrder[b.status_sekolah] : 2;
    if(sa!==sb) return sa-sb;
    const namaCmp = (a.nama_sekolah||'').localeCompare(b.nama_sekolah||'');
    if(namaCmp!==0) return namaCmp;
    return (a.kecamatan||'').localeCompare(b.kecamatan||'');
  });
}
